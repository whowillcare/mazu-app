version: '3.8'

networks:
  internal:
    external: true
    name: ${INTRANET:-internal}
  outside:
    external: true
    name: ${LBE}

services:
  mazu-app:
    image: ${REGISTRY:-127.0.0.1:5000}/mazu-app:latest
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    networks:
      - outside
      - internal
    volumes:
      - ${SHAREMNT}/.mazu:/app/data
    deploy:
      replicas: 1
      labels:
        DESCRIPTION: ''
        DOMAINS: mazu.wit4you.com
        UPSTREAM: mazu-app
        EXPOSE: 3000
        SSL: 2
        ISWEB: 2
        OUTEREXTRA: |-
          server {
          listen 443 ssl;
          listen 80;
          server_name mazu.wit4you.com;
          include ssl/ssl.conf;
          include ssl/*wit4you.com[.]conf;
          return 301 https://mazu.wit4you.com$$request_uri;
          }
