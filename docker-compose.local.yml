services:
  mazu-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mazu-sixty-lots:latest
    container_name: mazu_lots_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - mazu_storage:/app/storage

volumes:
  mazu_storage:
    driver: local
