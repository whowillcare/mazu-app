criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 凡事 恐防風波災／作事 退步／家事 恐防有變／婚姻 不合。有鬼作怪／功名 難得／經商 難就。了錢／治病 必危。有陰公作祟／月令
      了錢／耕作 無收／魚苗 失利難如意——整签偏负（jie_yue_score -16）。留余地的只有三处：求財 春夏好秋冬呆、六甲 先男後女。子媳虛、求雨
      不日到。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在婚姻、功名、经商、月令与耕作几处都设阻，唯求财给天暖的那半季留了一点余地、子嗣一项部分可取、求雨一项单独给了正面说法，整组偏负。
provenance:
