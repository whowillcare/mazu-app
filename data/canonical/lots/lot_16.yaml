    evidence: temple judgements run negative throughout - 凡事 恐防風波災／作事 退步／家事 恐防有變／婚姻
      不合。有鬼作怪／功名 難得／經商 難就。了錢／治病 必危。有陰公作祟／月令 了錢 (jie_yue_score -16); the only openings
