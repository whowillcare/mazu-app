reading_notes:
- term: 心高
  pinyin: xīn-gāo
  en: '"high-minded": at once *ambition* and *a reach beyond your means*. The line
    does not condemn the ambition; it warns about its timing.'
  zh: 既指志向高，也指越过自身份量去够。此句并非贬低志向，只提醒它的时机。
- term: 依舊路
  pinyin: yī-jiù-lù
  en: '"the road as it was": at once *going back the way you came*; *keeping to what
    already works*.'
  zh: 既指顺着来时的原路回去，也指守住已经行得通的做法。
- term: 自分明
  pinyin: zì-fēn-míng
  en: '"becomes plain of itself": not "you will be told"; but the picture clearing
    by itself once conditions turn.'
  zh: 不是「有人会告诉你」，而是条件一转，那图景自己就清楚了。
plain_meaning:
  en: 'The picture is dark and the timing is not yours to choose: the poem asks you
    to lower your aim for now, go back to the road that already works, and wait for
    the moon rather than argue with the cloud. It ends in clearing, not in loss.'
  zh: 眼前图景还暗，时机不由你来挑：此诗劝你此刻把目标放低，回到那条已经走得通的老路，等月出，而不是跟云较劲。它落在云散天清，不落在失去。
