criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 凡事 被人害。理終明／婚姻 不成。由天註定／家運 不佳。可住平安／功名 難得／出外 不可／經商 難如意。守待時／官事 命運犯刑相剋／治病
      險。月光好——整签偏负，多类目受阻而带刑剋之意；然 作事 月光好、移居 可、來人 月頭到、遠信 將近就至 等处留有余地，与英文所示「云散天清」的收尾相合。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在婚姻、家运、功名、出外、经商、官事、治病等类目上多持保留，办事一项却注明趁月色行事，移居、来人、远信三项亦留有余地。整体偏保守，收尾处指向云散月明。
