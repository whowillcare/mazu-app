    poem''s question about rank and worth. The temple site carries a different group
    for this lot — Zhu Shouchang and Guanyin''s roc — so both are named and neither
    is chosen.*'
  textual_provenance: null
  reviewed_on: '2026-10-06'
verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 富貴由命天註定，
    en: Wealth and rank are allotted, not chosen;
  - line_number: 2
    zh: 心高必然誤君期，
    en: reach too high and you miss your own time;
  - line_number: 3
    zh: 不然且回依舊路，
    en: if it will not come, then turn back to the road you know;
  - line_number: 4
    zh: 雲開月出自分明。
    en: the clouds open, the moon comes out, and it is plain.
keywords:
