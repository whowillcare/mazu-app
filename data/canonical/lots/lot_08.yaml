reading_notes:
- term: 看看
  pinyin: kàn-kàn
  en: '"look, by and by": at once *seeing* and *watching it come about*; The ripening
    is already under way.'
  zh: 是眼看着、渐渐要：既指看见，也指看着它成起来。成熟已经在进行中。
- term: 兩相全
  pinyin: liǎng-xiāng-quán
  en: '"whole for both sides": a mutual completion; not a one-sided win.'
  zh: 是两边都成全：是双方一齐圆满，不是一方独赢。
- term: 鼓舞
  pinyin: gǔ-wǔ
  en: 'to clap and dance: at once *encouragement* and *the drumming of celebration*;
    One old edition reads 皷腹 (*patting a full belly*) — the sense of plenty is the
    same.'
  zh: 是拍掌起舞：既指鼓舞，也指庆贺的擂鼓。旧本有一处作「皷腹」（拍着吃饱的肚子），饱满这一层意思是一样的。
plain_meaning:
  en: 'Something is already ripening: the terms are whole for both sides if you keep
    to accord, and the poem sends you home to sit at ease rather than to press the
    matter further. The household is the good ground here.'
  zh: 有些东西已经在熟了：只要顺着和气走，条件对双方都是完整的；诗把你送回家里安坐，而不是要你再把事情往前逼。这一签的好地面在家里。
