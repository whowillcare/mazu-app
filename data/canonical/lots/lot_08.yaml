    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 和者得。不和失／家事 進益團美／家運 平安／婚姻 成。大吉。兩全其美／求兒 吉／求財 下半年好。家利／功名
      二次得進／歲君 和氣／出外 不可／經商 有利必得／行舟 得財／移居 大吉／失物 速尋必在／官事 二次完明。了財／六畜 大吉／耕作 下半年有收成／築室 居中。鼓員固美／墳墓
      地運有合／討海 好／作塭 允收／魚苗 大利／月令 破財。下年不畏／尋人 速至／遠信 速至——整签偏正（jie_yue_score +18），惟 出外 不可、治病
      少不畏。老不好、月令 破財。下年不畏 三处留有余地。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 我方读作 mixed：婚姻、家宅、六畜几处都顺，进项后半季见好；出外与月令两处带提醒。支持与阻力同现，故读作 mixed。
