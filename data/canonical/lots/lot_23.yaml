verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 欲去長江水闊茫，
    en: You would set out on the Long River, wide and vague;
  - line_number: 2
    zh: 前途未遂運未通，
    en: the road ahead does not pay yet and the time is not open;
  - line_number: 3
    zh: 如今絲綸常在手，
    en: and now — the line is always in your hand;
  - line_number: 4
    zh: 只恐魚水不相逢。
    en: the only fear is that the fish and the water never meet.
