reading_notes:
- term: 水闊茫
  pinyin: shuǐ-kuò-máng
  en: '"wide and vague": the water''s *width*; the *uncertainty of the undertaking*
    are one phrase.'
  zh: 里，水的宽与所办之事的不确定是同一句话。
- term: 絲綸
  pinyin: sī-lún
  en: 'silk line: at once *the fisherman''s line* and, in the old usage, *the imperial
    rescript*; Readiness in hand, not yet answered.'
  zh: 既指钓丝，旧用也指诏命。线在手里，却还没等到回音。
- term: 魚水
  pinyin: yú-shuǐ
  en: 'fish and water: the classic figure for *a fit between two parties* — ruler
    and minister, or two people; The poem''s fear is that the fit does not arrive.'
  zh: 是双方契合的经典比喻——君与臣，或两个人。此诗怕的正是这份契合不来。
plain_meaning:
  en: 'The line is in your hand and the water is wide: readiness without the meeting.
    This is a season to keep to the shore and stop spending on the crossing, not a
    season for the great undertaking. The poem ends by doubting the fit, and the doubting
    is the counsel.'
  zh: 钓线在你手里，水却又宽又茫：有准备，却见不到那场相遇。这一程该守在岸边、别再为过渡掏钱，不是做大事的时候。诗以「怕是配不上」收尾，而这份疑，就是它的劝告。
question_gate:
  scope: one_matter
  rewritten_from:
