  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: The temple book gives this lot richly, but always with a condition -
      income, family fortune, livestock, ponds and the month's turn are all spoken
      well of, while undertakings and advancement are held back, and a departure is
      set down for later, when going slowly may bring in more. Both faces of the lot
      hang on a slow start ripening into a late result.
criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 庙本解曰：凡事 有公人求完。吉／作事 難成／家事 家庭進益／家運 瑞氣滿門／婚姻 難成。成者大吉／求兒 好。大吉／六甲 男女貴氣。先男後女／求財
      大吉。寶樹開花／功名 無／歲君 吉／治病 祝天地者平安／出外 不可。慢即有大財／經商 先平平。後大吉／來人 月光到／行舟 早晚平平／移居 好／失物 急尋在。西尋／求雨
      及時／官事 拖尾。去倒得失了錢／六畜 平安大進／耕作 早好晚平／築室 慢吉／墳墓 吉地吉穴／討海 和者大吉／作塭 先呆後有大利／魚苗 後有大利／月令 漸春風好／尋人
      速回／遠信 音信速至（jie_yue_score +18）。整签两头都在：财、家、六畜、塭池一侧给得丰，作事 難成、功名 無、出外 不可 一侧则收着，且明说「慢」「後」；好结果都挂在熬过开头之后。校勘：全一致。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词给得丰，但都带条件：财、家运、六畜、塭池与月令一侧都是好话，办事与功名一侧则收着，出行一项先按下、晚走反倒有大财。两面都挂在「先慢后成」上。
