    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements are rich but conditional - 凡事 有公人求完。吉／家運 瑞氣滿門／求財 大吉。寶樹開花／六畜
      平安大進／討海 和者大吉／月令 漸春風好, set against 作事 難成／婚姻 難成。成者大吉／功名 無／出外 不可。慢即有大財 (jie_yue_score
