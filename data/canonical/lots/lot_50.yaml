reading_notes:
- term: 無異心
  pinyin: wú-yì-xīn
  en: 'with no divided heart: single-minded constancy; undivided loyalty or faith.'
  zh: 既指一门心思的守常，也指不分的忠心或信靠；两层都在。
- term: 本是鐵
  pinyin: běn-shì-tiě
  en: 'was iron to begin with: what you have now is raw and unrefined; a self-deprecating
    reading: my present state counts for little.'
  zh: 既指你手上这件东西还是生的、没炼过，也有一层自谦的读法：我眼下这点分量不算什么。
- term: 得成金
  pinyin: dé-chéng-jīn
  en: 'can be brought to become gold: base material refined into something precious;
    a person of low standing raised up; the poem leaves which sense open.'
  zh: 既指粗料炼成贵重之物，也指低微的人被抬举起来；诗把是哪一层留着，不点破。
plain_meaning:
  en: 'A season of slow transformation: the judgements grant wealth, family blessing
    and a whole-hearted start, yet also say that undertakings are hard to bring off
    and official rank is not granted. The poem''s counsel is constancy - keep faith
    with your promise, and what is base iron can be worked into gold; the change comes
    late and by patient effort, not by force.'
  zh: 这是一段慢慢变的时节：判词给足了财、家和一心一意的开头，同时又收着办事与功名这两头。诗的话是守常——把许下的心意守住，铁也能化成金；这个转变来得晚，靠的是熬，不是硬逼。
