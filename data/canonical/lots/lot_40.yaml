reading_notes:
- term: 祿位
  pinyin: lù-wèi
  en: 'the rank and stipend that come with office: a position and its salary, reached
    in a working life; in the older sense, a share of fortune allotted to a person;
    the line treats it as already in place.'
  zh: 既是官职与那份俸禄，也是旧说里一个人命分中分到的那一份；这一句当作已经在位来读。
- term: 門戶
  pinyin: mén-hù
  en: 'the gate and doors of a house, and by extension the household: the family and
    its standing in the world; the literal gate of the house, which is said to shine;
    both senses are meant at once.'
  zh: 既是家门与门第，也是屋子里那道实在的门；这一句两义同时用。第二句另有异文：维基文库作「君家門戶光生輝」，feishuai／mznn／91chouqian／好廟網四源作「定光輝」；本定本按六源多数决取「定光輝」，两读一并摊开。
- term: 夫妻百歲
  pinyin: fū-qī-bǎi-suì
  en: 'man and wife to a hundred years: a marriage that lasts a whole lifetime; a
    blessing spoken over a couple; the poem wishes it rather than fixing a term.'
  zh: 既是相守一辈子，也是给一对夫妻的祝语；诗是在祝愿，不是在定一个期限。
plain_meaning:
  en: 'A season of fulfilment with a lagging finish: wealth, household and standing
    all move forward, while the one thing that stalls is the start of a practical
    undertaking. Keep your hand on what is already yours, and let the delayed piece
    catch up in its own time rather than forcing it.'
  zh: 这是一季收成的时节，只是尾巴拖得慢：财、家、名位都在往前走，唯独一件实事开不了头。手按在已经属于你的东西上，让迟来的那一块自己跟上，不要去硬推。
