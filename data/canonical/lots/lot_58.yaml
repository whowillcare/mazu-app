reading_notes:
- term: 蛇身
  pinyin: shé-shēn
  en: '"a snake''s body": at once *the animal* and *the shape of a person whose turn
    has not come*. The poem does not despise the ambition; it questions the hour.'
  zh: 既指那动物本身，也指一个时运还没到的人现在这副样子；诗不轻看这份志向，它问的是时候。
- term: 寬心坐
  pinyin: kuān-xīn-zuò
  en: '"sit with a wide heart": at once *rest the body* and *do not let the mind tighten*;
    It is a prescription for the long illness of the third line.'
  zh: 既是让身子歇着，也是别让心绷紧；这是给第三句那场久病开的方子。
- term: 言語雖多不可從
  pinyin: yán-yǔ-suī-duō-bù-kě-cóng
  en: '"though the words are many, do not follow them": at once *do not take advice
    from everyone* and *do not be talked into a move*; The line is about what you
    listen to.'
  zh: 既指别谁的劝都收下，也指别被人说动去动一步；这一句讲的是你听什么。
plain_meaning:
  en: 'The wish is to become something larger than the season allows: a long illness
    and a long wait are what the poem names, and its counsel is to sit quiet, take
    the small gains that are actually there, and not be talked into a move by the
    many voices around you.'
  zh: 想变成比这一季容得下的更大的东西；诗点到的是久病与久等。此时宜安静坐着、把确实在的小利收下，不要被人多口杂推着走出一步。
