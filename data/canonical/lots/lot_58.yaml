stories:
- title:
    zh: 白娘子詐言往南海
    en: The White Snake Claims She Sails to the South Sea
  is_primary: true
  is_variant: false
  cross_reference_lot: null
  narrative:
    zh: 白娘子是一条白蛇修炼成的女子，取名白素贞。她在杭州西湖边遇见许仙，两人结成夫妻，婚后帮他开了一间药铺。镇江金山寺的和尚法海看出她的本相，一再从中挑拨。端午节那天，白素贞喝了雄黄酒，现出蛇身，许仙受惊而死。她远赴仙山盗取仙草，把丈夫救活。后来法海把许仙留在寺里，白素贞与侍女青儿运水漫上金山，因腹中有孕而败。法海用钵把她收住，压在雷峰塔下。题名说她诈言往南海，取的是她以言语相诳的一节。南海是观音菩萨的道场，往南海就是去求菩萨。
    en: Lady White was a woman formed from a white snake in long cultivation, and
      she took the name Bai Suzhen. By West Lake in Hangzhou she met Xu Xuan. The
      two became husband and wife, and after the marriage she helped him open a medicine
      shop. The monk Fahai of Jinshan Temple in Zhenjiang saw her true form and kept
      stirring up trouble between them. On the day of the Dragon Boat Festival, Bai
      Suzhen drank realgar wine and showed her snake body, and Xu Xuan died of fright.
      She travelled far to a mountain of the immortals, stole a magic herb, and brought
      her husband back to life. Later Fahai kept Xu Xuan in the temple. Bai Suzhen
      and her maid Xiaoqing raised water to flood Jinshan, but failed because she
      was with child. Fahai caught her in his alms bowl and pinned her under Leifeng
      Pagoda. The title says she falsely claimed she was going to the South Sea. It
      takes the part where she deceived others with words. The South Sea is the place
      of Guanyin Bodhisattva, and going there means going to ask the Bodhisattva for
      help.
  poem_connection:
    zh: 签诗说蛇身意欲变成龙，又说言语虽多不可从。白蛇之身与“诈言”二字，正与这条签的语汇相合。
    en: The lot poem says a snake's body wishes to become a dragon, and that many
      words are not to be followed. The white snake and the false claim match the
      very words of this lot.
- title:
    zh: 宋江落草
    en: Song Jiang Turns Outlaw
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 宋江原是郓城县衙里的一名押司。押司是衙门里管文书的小吏，地位不高，管的是案卷和公文。因为一桩人命官司，他杀了阎婆惜，从此逃亡，几经周折被刺配到江州，也就是被发配充军到江州。在江州，他到浔阳楼饮酒，醉后在墙上题了诗，被黄文炳看见，摘出诗里的句子去告发，成了死罪。梁山的好汉得知消息，赶到江州法场，把他劫了出来。宋江从此跟随众人上梁山入伙，也就是落草。后来他坐了第一把交椅，把聚义厅改名为忠义堂，最终受了朝廷招安，奉命去征讨四方。
    en: Song Jiang was a clerk in the county office of Yuncheng. Such a clerk handled
      documents within the office, a minor post with little standing, and his work
      was case files and official papers. Because of a case involving a death, he
      killed Yan Poxi, and from then on he was on the run. After many twists he was
      sentenced to exile and sent as a conscript to Jiangzhou. There he drank at the
      Xunyang Pavilion. Drunk, he wrote a poem on the wall. Huang Wenbing saw it,
      picked out lines from it, and reported him, and the matter became a capital
      charge. When the sworn brothers of Mount Liang heard of it, they came to the
      execution ground at Jiangzhou and pulled him out by force. From then on Song
      Jiang joined the company on Mount Liang, which is to say he became an outlaw.
      In time he took the head seat, and he changed the Hall of Gathering to the Hall
      of Loyalty and Righteousness. At last he accepted the court's amnesty and was
      ordered to campaign in all directions.
  poem_connection:
    zh: 签诗说蛇身欲变龙而运未通、言语多不可从；宋江由小吏变草寇，正合这一层。
    en: The poem says a snake wishes to turn into a dragon but its time has not come,
      and that words should not be followed. Song Jiang going from minor clerk to
      outlaw fits.
- title:
    zh: 黃巢起事
    en: Huang Chao Raises a Rebellion
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 黄巢是曹州冤句人，家里以贩私盐为业。他善于骑马射箭，几次到京城应考进士，都没有考中。唐朝末年赋税和差役很重，又接连闹水灾旱灾，王仙芝在长垣起兵，黄巢聚集人马响应。他的队伍转战山东、河南、淮南之间，声势越来越大。王仙芝兵败身死之后，黄巢自称冲天大将军，带兵南下，一度打进广州。因为部下不服水土，他又掉头北上，渡过长江，攻破洛阳，进入长安。他在长安登位称帝，国号大齐。唐朝调集各路兵马反攻，黄巢退出长安，在河南、山东一带转战，最后死在泰山的狼虎谷。
    en: Huang Chao came from Yuanju in Caozhou. His family made its living by smuggling
      salt. He was a good horseman and archer, and he went to the capital several
      times to sit for the highest examination, but he never passed. In the last years
      of the Tang dynasty taxes and labor service weighed heavily on the people, and
      floods and droughts came one after another. Wang Xianzhi raised troops at Changyuan,
      and Huang Chao gathered men of his own and joined him. His band fought its way
      across Shandong, Henan and Huainan, and grew larger and louder as it went. After
      Wang Xianzhi was defeated and killed, Huang Chao took the title of Great General
      Who Rushes to Heaven, led his men south, and at one point entered Guangzhou.
      His troops could not bear the climate there, so he turned north again, crossed
      the Yangtze River, broke through Luoyang, and entered Chang'an. In Chang'an
      he took the throne and named his state Qi. The Tang court gathered armies from
      every region and struck back. Huang Chao left Chang'an and fought across Henan
      and Shandong, and in the end he died at Wolf-Tiger Valley in Mount Tai.
  poem_connection:
    zh: 这一签写起事的人出身低微却志在腾达，正扣签诗“蛇身意欲变成龙，只恐命内运未通”。
    en: A man of low birth who sets his heart on rising high fits a lot whose poem
      speaks of a snake wanting to become a dragon while its time has not yet come.
- title:
    zh: 羅江東歸吳越
    en: Luo Jiangdong Returns to Wu and Yue
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 罗隐字昭谏，唐末余杭人，余杭在今天浙江杭州一带。他诗写得好，自称江东罗隐，人们叫他罗江东。他十次去考进士，一次也没有考中。此后他在各地幕府之间流转，先到湖南，又到淮南，投靠一位位地方大员。他的诗文里讥刺时政的话多，为当权的人所忌，很久都不得志。后来他回到杭州，依附钱镠。钱镠占着两浙一带，待他很厚，用他的主意，只是不喜欢他那些讥刺的话。罗隐也替吴越谋划政事，朝廷授他给事中的官职，这是掌驳正政令的官。他晚年的境况比先前安定了些。题名取的“归吴越”三个字，讲的就是他放下科举、进钱氏幕府这一段。
    en: Luo Yin, whose courtesy name was Zhaojian, was a man of Yuhang in the late
      Tang. Yuhang lies in the Hangzhou area of Zhejiang today. He wrote good poetry,
      called himself Luo Yin of Jiangdong, and people called him Luo Jiangdong. Ten
      times he sat for the imperial examination, and not once did he pass. After that
      he moved about among the staffs of one regional governor after another, going
      first to Hunan and then to Huainan. He attached himself to one high official
      after the next. His poems and prose held a good deal of mockery of the politics
      of the day, which the men in power disliked. For a long time he got nowhere.
      Later he went back to Hangzhou and attached himself to Qian Liu. Qian Liu held
      the two Zhe provinces, treated him generously and used his ideas, only he did
      not care for the mocking words. Luo Yin also planned affairs of state for Wu
      and Yue. The court gave him the office of supervising secretary, an officer
      who reviews and corrects government orders. His last years were more settled
      than his earlier ones. The three words of the title, returning to Wu and Yue,
      cover the stretch in which he laid down the examinations and entered Qian's
      service.
  poem_connection:
    zh: 签诗说“蛇身意欲变成龙，只恐命内运未通”，正对罗隐自比蛟龙却屡试不第的处境；“久病且作宽心坐”与久困而终得依人相贴。
    en: The poem says the snake wants to become a dragon but the time within is not
      open; Luo Yin likened himself to a dragon yet never passed, and long illness
      sits with long hardship ended by another's support.
- title:
    zh: 王莽篡位
    en: Wang Mang Usurps the Throne
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 王莽字巨君，是西汉外戚王家的子弟。外戚就是皇帝的母族和妻族。他的姑母是汉元帝的皇后王政君。王莽入朝做官，为人谦恭俭省，又结交名士，名声很好，官职一路升到大司马，后来封为安汉公。平帝去世后，他立两岁的孺子婴为帝，自己称摄皇帝，代行皇帝之权。不久，他借符命图谶之说，说天意要他做皇帝，就接受让位，登上皇位，改国号为“新”，西汉就此中断。符命图谶是当时流行的预言和祥瑞之说。他在位时托古改制，法令繁苛，又逢连年天灾，天下大乱，赤眉、绿林两支人马先后起事。新朝很快覆亡，王莽死在乱兵之中。
    en: Wang Mang, whose courtesy name was Jujun, was a member of the Wang family
      of consort relatives in the Western Han. Consort relatives were the families
      of an emperor's mother and wife. His aunt was Wang Zhengjun, empress of Emperor
      Yuan of Han. Wang Mang entered court as an official. He was modest and frugal,
      and he made friends with famous scholars, so his reputation was good. His offices
      rose until he was Grand Marshal, and he was later made Duke Anhan. After Emperor
      Ping died, he set up the two-year-old Ruzi Ying as emperor and called himself
      regent emperor, holding an emperor's powers in place of the ruler. Before long
      he used prognostic texts and omens to say that heaven wanted him as emperor.
      He accepted the abdication, took the throne, and changed the name of the realm
      to Xin. The Western Han ended there. Prognostic texts and omens were predictions
      and auspicious signs in fashion at the time. In power, he reformed the system
      in the name of antiquity. His laws were harsh and complicated, and years of
      natural disaster followed. The realm fell into great disorder. The Red Eyebrows
      and the Green Woods rose one after the other. The Xin dynasty soon fell, and
      Wang Mang died among mutinous soldiers.
  poem_connection:
    zh: 签诗首句“蛇身意欲变成龙”，以蛇变龙，正对以臣代君、越分称帝这一段。
    en: The first line of the lot's poem says a snake's body wants to become a dragon.
      A snake turning into a dragon fits a subject replacing his ruler and taking
      the imperial title.
- title:
    zh: 慕容貞下棋
    en: Murong Zhen Plays Chess
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 慕容贞是清代一部章回小说里的一名剑侠，绰号一枝梅，在江湖上很有名气。章回小说是分成一回来一回讲的长篇故事。他来到一座寺院，与院里一个叫静空的和尚对坐下棋。静空名义上是出家人，却不守佛门的规矩。出家人本该清心寡欲，他却贪财好利，一边招待来往客人，一边经营斋堂，处处盘算银钱。慕容贞坐下来与他下棋，一盘棋还没分出胜负，静空这些行径已经被人看在眼里。棋局之外，谁是怎样的人，也看得清清楚楚。后来静空为财惹出祸事，连性命也搭了进去。这一签说蛇身意欲变成龙，又说只恐命内运未通，言语虽多不可从，正配对局相看、志向虽大而终究难成的一段。
    en: Murong Zhen is a swordsman in a chapter novel of the Qing, nicknamed A Spray
      of Plum, and well known in the martial world. A chapter novel is a long story
      told chapter by chapter. He came to a temple and sat down to play chess with
      a monk there called Jingkong. Jingkong was a monk in name, but kept no rule
      of the Buddhist order. A monk should keep his mind clear and his wants few.
      He was greedy for money and profit, serving guests on one hand and running a
      dining hall on the other, and counting silver at every turn. Murong Zhen sat
      down to play with him. Before the game was decided, these doings of Jingkong
      had been noted by others. Outside the board, it was plain to see what sort of
      man each one was. Later Jingkong brought disaster on himself over money and
      lost his life with it.
  poem_connection:
    zh: 这一签说蛇身意欲变成龙、只恐命内运未通，又言语虽多不可从，正配局中人对弈相看而志大而身未能成的一段。
    en: This lot says a snake's body wants to become a dragon, and that many words
      are not to be followed - the two at the board, with great aims and no way to
      make them come true.
- title:
    zh: 白蛇精詐言往南海遇漢文
    en: The White Snake Spirit Meets Xu Hanwen
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 一条白蛇修炼成精，化成女子，取名白素贞。她打听到从前放生过自己的善人许汉文在杭州，就带着侍女小青下山，要去找他报恩。她对别人说自己要往南海去进香，一路经过西湖。南海是传说中观音菩萨住的地方，香客常去进香。在西湖边，她遇见了许汉文。当时正下着雨，两人借伞相识，后来结为夫妻。金山寺的和尚法海看出白素贞是蛇精，几次点破。白素贞为了找回许汉文，施法引来大水，淹了金山寺。法海用佛法收住她，把她压在雷峰塔下。这座塔在西湖边上。
    en: A white snake practiced until it became a spirit and took the form of a woman,
      and called herself Bai Suzhen. She learned that Xu Hanwen, a kind man who had
      once set her free, was in Hangzhou. She came down from the mountain with her
      maid Xiaoqing to find him and repay his kindness. She told others she was going
      to the South Sea to burn incense, and on the way she passed West Lake. The South
      Sea is where the Bodhisattva Guanyin is said to live in legend, and worshippers
      often go there to burn incense. By West Lake she met Xu Hanwen. It was raining,
      and the two came to know each other by lending an umbrella, and later they became
      husband and wife. The monk Fahai of Jinshan Temple saw that Bai Suzhen was a
      snake spirit and exposed her several times. To find Xu Hanwen again, Bai Suzhen
      used her magic to raise a great flood and drown the Jinshan Temple. Fahai caught
      her with the power of the Buddhist law and pressed her under Leifeng Pagoda.
      This pagoda stands by West Lake.
  poem_connection:
    zh: 签诗说蛇身想变成龙，只怕命里的时运还没通。白蛇化形求变却终于受阻，正合此题。
    en: The lot poem says a snake's body wants to become a dragon, but fears its time
      has not yet come. The white snake took human form to seek change and was held
      back at last.
- title:
    zh: 袁達入昭國關
    en: Yuan Da Enters Zhaoguo Pass
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 袁达是战国时齐国的一员猛将，力气很大，拜在孙膑门下。秦始皇要吞并六国，攻破赵国的界牌关以后，又进兵燕国。燕国抵挡不住，向齐国求救。齐国派保国公袁达和将军李牧领兵来援助，在易水附近扎营。秦国的将军王翦和袁达对阵，打不过他。王翦便暗念咒语，祭起一口宝剑。空中出现一朵红云，托着宝剑，直取袁达的头顶。袁达举起大斧招架，却招架不住，中剑落马。题面上的昭国关，就是昭谷关，是同一个地名写成的另一种样子。孙膑原先劝过袁达不要硬闯，他没有听从。
    en: Yuan Da was a fierce general of the state of Qi in the Warring States period.
      He was very strong and became a follower of Sun Bin. The First Emperor of Qin
      meant to swallow the six states. After breaking through the Jiepai Pass of Zhao
      he moved his troops on toward Yan. Yan could not hold out and asked Qi for help.
      Qi sent the Duke of Baoguo, Yuan Da, and the general Li Mu with troops to aid
      Yan, and they camped near the Yi River. Wang Jian, general of Qin, faced Yuan
      Da and could not beat him. So Wang Jian secretly recited an incantation and
      raised up a sword. A red cloud appeared in the sky, holding the sword, and it
      came straight for the top of Yuan Da's head. Yuan Da lifted his great axe to
      block it, but could not hold it off, was struck by the sword, and fell from
      his horse. The name on the title is the same place as Zhaogu Pass, written in
      another form. Sun Bin had earlier warned Yuan Da not to force his way through,
      and he did not listen.
  poem_connection:
    zh: 这一签说只恐运未通、言语虽多不可从，正配袁达不听劝告、硬闯关隘而落马。
    en: This lot says the time is not yet open, and much is said that should not be
      followed. It fits Yuan Da ignoring the warning and forcing the pass, only to
      fall from his horse.
