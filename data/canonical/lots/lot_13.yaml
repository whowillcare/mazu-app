reading_notes:
- term: 羅孛
  pinyin: luó-bèi
  en: 'the malefic stars Luohou and Yuebei of the old star-almanac: at once a *named
    obstacle* and the plain sense of *a bad pass*; It names a season, not a fate.'
  zh: 旧星历里的两颗凶星罗睺与月孛：既指一个有名字的关口，也指「一段走不动的关口」这个平常意思。它点的是一个时段，不是一个人的命数。
- term: 問神
  pinyin: wèn-shén
  en: 'to ask the gods: the line warns that ritual alone does not carry you over;
    not that the gods refuse you.'
  zh: 向神明求问：这一句提醒的是只靠仪式抬不过这个关口，并不是说神明不理你。
- term: 行舟上高灘
  pinyin: xíng-zhōu-shàng-gāo-tān
  en: '"a boat run up onto a shoal": at once a scene of grounding and an instruction;
    stop rowing against the water.'
  zh: ：既是一幅船搁浅的画面，也是一句指示——不要再顶着水势划。
plain_meaning:
  en: 'A grounded season: effort is spent without landing, and asking for help does
    not by itself lift the boat off the shoal. The counsel is protective — pull back,
    wait for water, and make your merit quietly rather than straining harder.'
  zh: 这一季像船搁上了滩：力气花出去却落不到实处，光靠求神问卜也不会把船抬回水里。给的做法是护住自己——先退回来、等水位上来，把善事安静地做，而不是再使更大的劲。
question_gate:
  scope: one_matter
  rewritten_from:
    en: Is my partner cheating on me?
    zh: 我的伴侣是不是在出轨？
  rewritten_to:
