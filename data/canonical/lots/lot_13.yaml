criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 凡事 不吉／作事 先難後興／家事 門庭起風波／家運 人不安。邪作祟／婚姻 難合／求兒 不可／六甲 臨產危險／求財 犯活鬼。下年無／功名
      費工。望後得進／歲君 淡淡。凶事不美／治病 犯太歲必死。未不畏／出外 不可／經商 失運／來人 難望／行舟 不順。失利／移居 不可／失物 錢難尋。未日在／官事
      大呆／六畜 不吉／耕作 小收。不利／築室 犯災星／墳墓 地勢不吉／討海 不好。無財。失利／作塭 防風水。失。虧本／魚苗 待機可以／月令 正月至六月止／尋人
      難。免望／遠信 音息魚沉（jie_yue_score −13）。整签偏负，唯 功名 費工。望後得進、魚苗 待機可以、作事 先難後興 三处留有余地。校勘：多数决，第二句「總未安」经六源投票改为「總未休」（5/6）；维基文库作「總未安」，其余四源作「總未休」，定本从多数。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词通签偏受阻，家事、婚姻、求财、经商、行舟、月令、远信等处都指向同一侧；只有功名、择日与「先难后顺」一条留有余地。底本第二句经六源投票定为一路读法（六源中五源相同，另一路作「總未安」），差异照实记录在案。
