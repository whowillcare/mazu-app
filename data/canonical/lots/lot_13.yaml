verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 命中正逢羅孛關，
    en: Your lot has fallen on the Luo-Bo pass;
  - line_number: 2
    zh: 用盡心機總未休，
    en: you spend all your wit, and still there is no rest;
  - line_number: 3
    zh: 作福問神難得過，
    en: you make merit and ask the gods — it is hard to get through;
  - line_number: 4
    zh: 恰是行舟上高灘。
    en: it is exactly a boat run up onto a shoal.
keywords:
  favourable:
