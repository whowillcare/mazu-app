criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 後成。／作事 月光成。／家事 冒險。平安。／家運 漸漸平安。／婚姻 皆由天註定，／求兒 好。／六甲
      定必生女。／求財 有成。／功名 少有成。老無。／歲君 好。／治病 少險。老不畏。／出外 滿路異香。／經商 成者大吉。／來人 月中到。／行舟 須當先防。／移居
      不吉。／失物 月光在。月暗無。／求雨 初無。月尾有。／官事 破財。完局。／六畜 興旺。／耕作 有收。／築室 月中好。／墳墓 地勢甚美。／討海 合和吉。不合凶。／作塭
      須防風水。／魚苗 月中吉。／月令 淡淡。／尋人 月中遇。／遠信 可喜。——整签偏正而慢，好处落在月中与偏后；惟 移居 不吉、功名 少有成。老無、月令 淡淡
      三处留有余地（jie_yue_score 10）。
  external:
