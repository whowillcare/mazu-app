stories:
- title:
    zh: 蜻蜓飛入蜘蛛網
    en: A Dragonfly Blunders into a Spider's Web
  is_primary: true
  is_variant: false
  cross_reference_lot: null
  narrative:
    zh: 蜘蛛结网在房檐和梁柱之间，丝又细又密，不仔细看很难发现。蜻蜓鼓着翅膀飞过，一头撞进网里，翅膀被丝缠住。它越挣扎，丝缠得越紧，明明有翅膀也飞不掉。这一类故事讲的就是误撞进去、被缠住、脱不了身。题名取的是眼前的一幅景象，没有人物，也没有朝代。同一条目下还有写作“飞入”和“误入”的，用字不同，说的是同一件事。签诗说，阳世做事未必都能如意，云遮月色正朦胧；心里想要往前去，只恐命内运未通。网前的蜻蜓，正是这样一片朦胧。
    en: A spider spreads its web between the eaves and the beams. The threads are
      fine and close, and hard to see unless one looks carefully. A dragonfly comes
      flying on its wings and blunders head first into the web. Its wings are caught
      in the threads. The more it struggles, the tighter the threads wind round it.
      It has wings, yet it cannot fly away. Tales of this kind tell of blundering
      in, being caught, and being unable to get free. The title takes a single scene
      before the eyes. There is no person in it, and no dynasty. Other accounts of
      this lot title the scene flying in, or blundering in. The wording differs, but
      they tell the same thing. The lot poem says that in this world things do not
      always go as one wishes, and that clouds cover the moon and the light is dim.
      The heart wants to go forward, yet one fears the time within one's lot has not
      come. The dragonfly before the web sits in just such a dimness.
  poem_connection:
    zh: 签诗说云遮月色正朦胧，心中意欲前途去。蜻蜓误撞进网中，正合这种看不清前路、进退不得的情形。
    en: The lot poem says clouds dim the moon, and the heart wants to go on. A dragonfly
      that blunders into the web is caught in just such dimness, unable to go forward
      or back.
- title:
    zh: 王昭君投水
    en: Wang Zhaojun Throws Herself into the River
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 王昭君是汉元帝后宫里的良家女子，名叫王嫱，昭君是她的字。北方的匈奴单于来朝求婚，元帝把昭君赐给单于，封号宁胡阏氏，阏氏就是单于妻子的称呼。宫里挑人靠画像，画工毛延寿替宫女画像，谁给钱就把谁画得好看。昭君不肯送钱，被画得难看，皇帝一直没有见她。到要出塞的时候，皇帝才见到她本人，见出的是一位美人。昭君随单于北上，走到汉与匈奴交界的地方，她不肯进番，投江而死。她走后，元帝夜里梦见她，醒来只听见雁叫的声音。她的墓在江边，出塞和亲这件事，从此成为诗里常写的一段。
    en: Wang Zhaojun was a woman of good family in the rear palace of Emperor Yuan
      of the Han. Her name was Wang Qiang, and Zhaojun was her courtesy name. The
      chanyu, that is, the ruler of the Xiongnu in the north, came to court to ask
      for a marriage. The emperor gave Zhaojun to him with the title Ninghu Yanzhi,
      yanzhi being the word for a chanyu's wife. Women were chosen for the palace
      by their portraits, and the painter Mao Yanshou drew a woman well if she paid
      him. Zhaojun would not send money, so she was drawn plain, and the emperor never
      saw her. When the time came for her to leave for the frontier, the emperor saw
      her in person for the first time and saw a beauty. Zhaojun went north with the
      chanyu. At the border between the Han and the Xiongnu she would not go on into
      foreign country, and drowned herself in the river. After she was gone the emperor
      dreamed of her at night and woke to the sound of geese. Her grave stands by
      the river, and this frontier marriage became a stretch often written of in poems.
  poem_connection:
    zh: 签诗说“心中意欲前途去，只恐命内运未通”，正对昭君出塞、前路阻绝的处境；“云遮月色正朦胧”也与出塞途中的境象相合。
    en: The poem says the heart wants to go on along the road ahead but the time within
      is not open; Zhaojun's road past the frontier was cut off, and the clouded moon
      fits that journey out.
- title:
    zh: 秦始皇點民造長城
    en: Qin Shi Huang Conscripts the People to Build the Great Wall
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 秦始皇灭掉六国、统一天下以后，为防北方的胡人南下，派大将蒙恬领兵驱逐匈奴，又把燕、赵、秦三国原有的边墙连接起来，筑成一道长墙，西起临洮，东到辽东。胡人是当时对北方游牧民族的称呼。民间把这项工程叫作“点民”，就是按户口点数壮丁，一批批征去服役。修墙的人常年在外，累死、病死的很多，路上常见死者。流传最广的是孟姜女的故事。她的丈夫万喜良被征去筑城，孟姜女怕他受寒，远路送棉衣到边塞。到了才听说丈夫已经死了。她在城下痛哭，城墙竟被她哭塌了一段。
    en: After Qin Shi Huang destroyed the six states and unified the realm, he moved
      to keep the northern Hu peoples from coming south. He sent the general Meng
      Tian with troops to drive out the Xiongnu. He also joined the old border walls
      of Yan, Zhao, and Qin into one long wall. It ran from Lintao in the west to
      Liaodong in the east. Hu was the name used at the time for the northern pastoral
      peoples. Among the people, this work was called counting the people. That meant
      counting the able-bodied men by household and taking them off in batches for
      labor service. The men who built the wall stayed away year after year. Many
      died of exhaustion or illness, and dead bodies were often seen on the roads.
      The best-known story is that of Meng Jiangnu. Her husband, Wan Xiliang, was
      taken to build the wall. Meng Jiangnu feared he would suffer from cold, so she
      carried padded clothes a long way to the frontier. Only when she arrived did
      she hear that her husband was dead. She wept beneath the wall, and a section
      of the wall collapsed from her weeping.
  poem_connection:
    zh: 签诗“阳世作事未和同”“云遮月色正朦胧”，人事难合、世情昏暗，正对征夫筑城之苦。
    en: The lot's poem says affairs in the world do not agree, and that clouds hide
      the moon and the moonlight is dim. Human plans that do not fit and a murky world
      fit the hardship of conscripted builders.
- title:
    zh: 項王贈呂馬童
    en: The Hegemon King's Gift to Lü Matong
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 项羽是秦朝末年的一路诸侯，勇猛善战，号称西楚霸王。他在垓下一战败给刘邦的汉军。垓下在今天安徽一带。那一夜，他听见四周的汉军营里都唱起楚地的歌，知道大势已去，便带八百多名骑兵突围，向南逃走。到了乌江边，跟随他的只剩二十多人，后面追赶的汉军却有几千。乌江是长江边的一条支流。项羽自知跑不掉了，回身再战，又杀伤汉军上百人。汉军里有个骑兵军官叫吕马童，官名是司马。项羽认出他是旧相识，便对他说：听说汉王拿我的头悬赏，谁能得到，就赏千金、封万户侯；今天就把这份功劳送你。说完，他自刎而死。汉军争抢他的尸身，自相残杀的就有几十人，最后吕马童等五人各得到一段，都因此封了侯。这一签说云遮月色正朦胧，又说只恐命内运未通，正配项羽垓下被围、末路相赠的一段。
    en: 'Xiang Yu was one of the lords at the end of the Qin, brave and good at war,
      and was called the Hegemon King of Western Chu. He lost to Liu Bang''s Han army
      at the battle of Gaixia. Gaixia is in what is today Anhui. That night he heard
      the songs of Chu being sung in the Han camps all around him, knew that his cause
      was lost, and broke out with more than eight hundred horsemen, fleeing south.
      At the Wu River only twenty-odd men were left with him, while several thousand
      Han troops were chasing. The Wu River is a branch of the Yangtze. Xiang Yu knew
      he could not get away, turned and fought again, and killed or wounded more than
      a hundred of the Han soldiers. Among the Han cavalry was an officer named Lü
      Matong, whose post was sima. Xiang Yu recognized him as an old acquaintance
      and said to him: I hear the King of Han has offered a reward for my head, a
      thousand pieces of gold and a fief of ten thousand households for whoever gets
      it; today I give that honor to you. Then he cut his own throat. The Han soldiers
      fought over his body, and several dozen of them killed one another. In the end
      Lü Matong and four others each got a part, and all of them were made marquises
      for it.'
  poem_connection:
    zh: 这一签说云遮月色正朦胧、只恐命内运未通，正配项羽兵败被围、临末以此相赠故人的一段。
    en: This lot says the clouds hide the moon and all is dim, and that the luck within
      this life is not yet open - Xiang Yu shut in at Gaixia, giving to an old friend
      at the end.
