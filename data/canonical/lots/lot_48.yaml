      mazu_签诗_六源投票与裁定.csv）。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在婚姻、求财、家运、月令几处都偏阻，整体偏负；只有「顺和」一项与子嗣一项留有余地。校勘上本签是一处一字之改，依六源多数决所定。
