reading_notes:
- term: 未和同
  pinyin: wèi-hé-tóng
  en: '"not yet in accord": the dictionary text and the temple site both read 未和同;
    one branch has 未知同 (*not known to be the same*). We keep the majority reading,
    which is the one the second line''s dimness answers.'
  zh: 既指跟人还没谈拢，也指事情本身还没配齐；另有一处本子作「未知同」（不知道是否相同）。我们取多数本，也正是下一句「朦胧」所应的那层意思。
- term: 朦朧
  pinyin: méng-lóng
  en: '"dim, hazy": at once *the moon behind cloud*; *the unclear state of the affair*.'
  zh: 既指月亮被云遮住，也指事情本身看不清。
- term: 運未通
  pinyin: yùn-wèi-tōng
  en: '"the season has not opened": about *timing*, not about *capacity*; The poem
    doubts the hour, not the person.'
  zh: 说的是时令，不是本事；诗疑的是时候，不是人。
plain_meaning:
  en: 'Nothing is in accord yet and the light is dim: the wish to go is not in question,
    only the timing. The counsel is to hold your plan and keep your own counsel until
    the season opens, rather than force agreement or set out in the haze.'
  zh: 眼下诸事都还没和合，光线也暗：想走的那颗心不是问题，问题在时机。此时宜守住计划、把主意留在自己这里，等时令开了再动，不必强求别人同意，也别在雾里上路。
