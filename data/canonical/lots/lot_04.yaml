    evidence: The temple book is broadly favourable on this lot — general affairs,
      undertakings, household, family fortune, marriage, children, advancement, the
      year's ruler, illness, going out, trade, visitors, boats, moving house, livestock,
      field work, building, graves, sea work, ponds, fry, the month's season and finding
      people all sit on the positive side, many of them tied to the middle or the
      end of the month; two lines are left open — income reads better at home than
      abroad, and distant news runs slow. We read it as favourable.
criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 不須多憂慮，／作事 有成。／家事 綿綿齊輝。／家運 大獲吉昌。／婚姻 和諧。月半成。／求兒
      好。／六甲 先男後女。／求財 在家好。出外凶。／功名 顯祖榮宗。／歲君 平安。／治病 近日痊癒。／出外 求財求事如意。／經商 大吉利。／來人 即到。／行舟
      風平。大吉。／移居 可慶。／失物 月光在。／求雨 月末即到。／官事 破財。求貴人解。／六畜 興盛。／耕作 有收。／築室 門庭興旺。／墳墓 可得瑞氣。／討海
      有大財。／作塭 有望。／魚苗 月光好。／月令 好。／尋人 快遇。／遠信 遲到。——整签偏正，惟 求財 在家好。出外凶 守住门外那一头，失物／求雨／魚苗／尋人／築室
      都落在月光月末（jie_yue_score 13）。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上大体偏正面——总类、作事、家事、家运、婚姻、求儿、子嗣、功名、岁君、治病、出外、经商、来客、行舟、迁居、六畜、耕作、筑室、坟墓、讨海、作塭、鱼苗、月令、寻人都落在正面一侧，许多项点在月中、月末这个窗口上；两处留有余地：求财一项偏在家、远出则弱，远信一项来得迟。故列为本批的偏正一档。
