reading_notes:
- term: 風恬浪靜
  pinyin: fēng-tián-làng-jìng
  en: 'still wind and calm water: the weather of the sea, the standing figure for
    safe passage; a household or an affair with no inner conflict in it.'
  zh: 一是海上的天气，是行船平安的老话；二也指一个家里、一件事里头没有内耗。
- term: 中秋月一輪
  pinyin: zhōng-qiū-yuè-yī-lún
  en: 'the mid-autumn moon, one full round: the eighth-month full moon, an image of
    completeness; a moon-round — that is, the middle of any month — the judgements
    here date matters to 月半 and 月光, not to a fixed festival.'
  zh: 一是八月十五那轮圆月，是圆满的景象；二也指月圆，也就是每月月中——这一签判词把事都定在「月半」「月光」，不是定在某一个节日。
- term: 自有
  pinyin: zì-yǒu
  en: 'comes of itself, is already there: assured provision, the lot''s assurance
    that the house is supplied; it does not mean no work is needed; the 耕作 and 六畜
    judgements still ask for the work.'
  zh: 是本来就备着、自己会来；但不是说不用做事——判词里「耕作」「六畜」两项仍在要这份工。
plain_meaning:
  en: 'A calm, well-lit season: the wind is still, a boat can put out, and the mid-autumn
    moon stands full. The poem asks the reader to set worry down, and the judgements
    agree — the household prospers, the work completes, the harvest comes in. The
    one caution sits outside the gate: gain made at home is read better than gain
    made far away.'
  zh: 一段平静、明亮的时节：风停浪静，船可以开出去，中秋的月正圆。诗是让人把操心放下的，判词也顺着说——家门兴旺、事情做得成、收成进得来。只有一条提醒，是在门外：在家里挣的，读得比远出挣的好。
