    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements are broadly positive — 凡事 不須多憂慮／家運 大獲吉昌／功名 顯祖榮宗／經商
      大吉利／行舟 風平。大吉／治病 近日痊癒, with one guard on gain made away from home (求財 在家好。出外凶)
      and a slow errand (遠信 遲到) (jie_yue_score 13)
  external:
