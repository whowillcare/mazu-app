reading_notes:
- term: 一半枯
  pinyin: yī-bàn-kū
  en: 'half of it withered: half the fruit withers and half ripens - the season is
    partly spent, not wholly lost; flower and fruit are one matter at two stages;
    the poem marks a loss in the middle of the growing.'
  zh: ：果子一半枯、一半熟，是说这一季用掉了一半，不是全盘失去。花与果是同一件事的两个阶段，诗是在生长的中途点出亏处。
- term: 虛度
  pinyin: xū-dù
  en: 'to pass the time unused: a year spent with nothing to show for it; a year spent
    without any undertaking brought to its end; the line blames the season, not the
    person.'
  zh: ：一年过去，没有什么可拿出手；也是说一年里没有一件事做到头。这句怪的是时令，不是人。
- term: 日落西山
  pinyin: rì-luò-xī-shān
  en: 'the sun behind the western hills: the plain end of a day; a set phrase for
    the late stretch of a life or of an enterprise.'
  zh: ：一是字面上的天晚；二是说一个人的后段、或一桩事业的后段，这是旧话里现成的一句。
plain_meaning:
  en: 'A closed season: the fruit half forms and half withers, the year goes by with
    little to show, and the light is already going west. Nothing here rewards pressing
    forward, so the counsel is protective - hold what you have, stop enlarging, and
    let this stretch pass. What is set aside now can be taken up when the season turns.'
  zh: 这是一个收束的季节：果子结了一半、枯了一半，光阴过去了却没什么留下，日头也已经在往西边落。这一季没有什么值得硬往前推的事，给出的做法是守——守住手上已有的，别再扩大，让这一段过去。此刻搁下的事，等季节转过来再拾起。
