verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 總是前途莫心勞，
    en: Whatever the road ahead, do not wear your heart out over it;
  - line_number: 2
    zh: 求神問聖枉是多，
    en: to ask the gods and question the sages is mostly wasted breath;
  - line_number: 3
    zh: 但看雞犬日過後，
    en: only wait until the days of the rooster and the dog are past;
  - line_number: 4
    zh: 不須作福事如何。
    en: no rites of blessing are needed - the matter shows itself in time.
keywords:
  favourable:
