verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 功名得意與君顯，
    en: Merit and fame come to you, your name made visible;
  - line_number: 2
    zh: 前途富貴喜安然，
    en: the road ahead holds wealth and honour, ease and joy.
  - line_number: 3
    zh: 若遇一輪明月照，
    en: If a single round bright moon comes shining down —
  - line_number: 4
    zh: 十五團圓光滿天。
    en: on the fifteenth it comes round whole, its light filling the sky.
