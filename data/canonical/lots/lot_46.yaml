criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 庙本解曰：凡事 大吉利／作事 成好／家事 福祉其昌／家運 安居樂業／婚姻 偕老／求兒 好／六甲 先男後女／功名 得意與君顯，／歲君
      吉／出外 有貴人好／經商 利市三倍／來人 月半有／行舟 可喜吉利／移居 好／失物 月光有／求雨 月半到／六畜 平平／耕作 平正／築室 得其所居／墳墓 得其吉地／討海
      月半過漸得利／作塭 可得財利／魚苗 利路亨通／月令 漸平安／尋人 月光在／遠信 月半就至（jie_yue_score +22）。整签偏正，惟 求財 平平、官事
      破財。完局 两处往下拉，治病 老拖尾。少立癒。则把老者一节说慢；月半（月中）是这份判词反复落点的地方。校勘：第四句依六源多数决，「團圓照滿天」→「團圓光滿天」（依据见
      mazu_签诗_六源投票与裁定.csv）。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在总类、家事、家运、婚姻、功名、经商、行舟、移居、讨海、作塭、月令、寻人、远信等处皆偏正面，唯「求财」与「官事」两项往下拉，医疗一类还把少者与老者分开说。校勘上第四句按六源多数决定字，不改文意。
