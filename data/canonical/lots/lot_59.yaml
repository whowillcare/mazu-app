reading_notes:
- term: 作福
  pinyin: zuò-fú
  en: 'to make merit, to do good: giving to others in the sense of merit-making; setting
    one''s own house in order before expecting any return; the poem opens on this
    word and does not narrow it.'
  zh: 是积福、做善事；也指先把自己家里料理清楚，再去指望回报。诗句从这个词起头，没有把它收窄。
- term: 會合
  pinyin: huì-hé
  en: 'to meet and join: an agreement concluded between two parties; people who have
    been apart meeting again; both senses sit in the compound.'
  zh: 既指双方把事情谈成一个定局，也指分开的人重新聚到一处；两层都在这一个复词里。
- term: 自然
  pinyin: zì-rán
  en: 'of itself, of its own accord: without being forced; by the ordinary course
    of things; the line describes a manner, not a moment.'
  zh: 既指不必去硬逼，也指照事情的常理自己走到那一步；这一句说的是势态，不是一个时点。
plain_meaning:
  en: 'A season that pays, and pays late: the judgements read good after the turn
    and slow but good, so the gain is real and it comes after the waiting. The poem
    states its counsel first - if the heart is set on doing good, do not put it off
    - and adds that the name you are after is best sought while the weather is clear.
    Move now on the good thing; let the return keep its own pace.'
  zh: 一段会有回报、而且报得晚的时节：判词读出「后吉」「慢好」，进项是真的，只是要等过这一段才来。诗先把话说明白——心里既有做福的念头，就不要拖；又说想求的名字，趁天时清吉的时候去求最好。该做的好事现在就动，回报让它按自己的步子来。
