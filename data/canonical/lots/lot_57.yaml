verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 勸君把定心莫虛，
    en: 'I counsel you: hold your heart steady, and let it not turn hollow;'
  - line_number: 2
    zh: 前途清吉得運時，
    en: the road ahead is clear and auspicious when its season comes;
  - line_number: 3
    zh: 到底中間無大事，
    en: after all, there is nothing of great weight between here and there;
  - line_number: 4
    zh: 又遇神仙守安居。
    en: and one meets the immortals who keep a quiet dwelling.
