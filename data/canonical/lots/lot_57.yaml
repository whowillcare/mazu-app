reading_notes:
- term: 把定
  pinyin: bǎ-dìng
  en: 'to hold steady, to set firm: gripping a decision and not letting go of it;
    the same phrase is used of holding a boat or a horse to its course; the poem asks
    for steadiness rather than for more effort.'
  zh: 是把一个决定抓住不放；同一个词也用来说把船、把马压在它的航道上——诗要的是稳，不是再多用力。
- term: 清吉
  pinyin: qīng-jí
  en: 'clear and auspicious: the road made plain, in the sense of weather clearing;
    the affair being ritually clean and therefore sound; the compound holds both,
    and English must not pick only one.'
  zh: 既指路被看清，像天色放晴；也指事情干净而因此吉利。这一复词两层都带着，不能只取一层。
- term: 神仙守安居
  pinyin: shén-xiān-shǒu-ān-jū
  en: 'divine ones keeping a peaceful dwelling: help from beyond the household standing
    guard over it; a quiet, unhurried home life as the thing being guarded; the line
    does not say which is the gift and which the guardian.'
  zh: 既指家门之外的力量替它守着；也指那份被守着的安稳日子本身。诗句没有说哪一个是礼、哪一个是守的人。
plain_meaning:
  en: 'A set, well-supported season: the road ahead is clear and what lies between
    here and there is not heavy. The poem names one condition in its first line -
    steady the heart and do not let doubt hollow it out. Do the ordinary work of the
    season, and let the help that is offered be accepted.'
  zh: 一段安定、有支撑的时节：前路清吉，这中间也没有多重的担子。诗在第一句就点出条件——把心定下来，别让疑虑把它掏空。做这一季该做的平常事，有人伸手来帮，就接住。
