register:
  level: mixed
  source: curated
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: 'the judgements run positive across the board - 家運 門庭永昌／婚姻 成好／求財 冬天大吉／官事
      萬和／歲君 吉／六畜 有利 - with the good tied to the household and to staying in: 凡事 自守待運／出外
      不可／移居 不可／行舟 了本／月令 不遂 (jie_yue_score +15)'
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: 'We read this lot as mixed: the household, marriage and thrifty-income
      lines stand well and reward staying put, while going out, moving house, boat
      passage and the month''s turn close. A stay-put reading rather than an open
      one, so we read it as mixed.'
criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 自守待運／作事 勤成／家事 門庭大益／家運 門庭永昌／婚姻 成好／求兒 平平／六甲 先男後女。貴氣／求財
      冬天大吉。依舊好／功名 後科／歲君 吉／治病 命拖尾。老少安／出外 不可／經商 小利。在家好／來人 月光到／行舟 了本／移居 不可／失物 尋有／求雨 不日到／官事
      萬和／六畜 有利／耕作 早平晚好／築室 平平／墳墓 地勢適宜／討海 無大財／作塭 自守可得／魚苗 小利益／月令 不遂／尋人 時到則回／遠信 音信緩至——整签偏正，好处系在家里、也系在当令，惟
      出外、移居 皆阻，行舟折本、討海 無大財、月令 一项留有余地（jie_yue_score +15）。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 我方读作 mixed：家运、婚姻与勤俭所得偏顺，宜守；出外、迁居、舟行与月令几处则收住。这是守则得、动则损之象，故读作 mixed。
