reading_notes:
- term: 君爾
  pinyin: jūn-ěr
  en: 'you, addressed plainly: a direct address to the person holding the lot; an
    impersonal ''one'', speaking to whoever reads it; no subject is fixed in the Chinese.'
  zh: 是当面称呼拿着这支签的人，也可以不指定是谁、泛指读到这句的任何人；中文原句没有定下主语，两种读法都留着。
- term: 命內
  pinyin: mìng-nèi
  en: 'within the lot, within one''s portion: what is already allotted; what is contained
    in the present circumstances.'
  zh: 既指早已分定的那一份，也指眼下处境里本来就含着的；两层都算。
- term: 祈保
  pinyin: qí-bǎo
  en: 'prayers, and the protection asked for: the petitions a person makes; the protection
    given in return; the phrase does not separate the two.'
  zh: 把「祈」与「保」合在一处：既指人所做的祈求，也指因此得到的护佑，这个复词本身不把两层分开。异文说明：末句别本一处作「祈保分明得自安」，本件依用户裁定取「祈保分明自平安」——文意更完整，也与已定的英文层一致。
plain_meaning:
  en: 'A wide-open season: the poem sets long blessing beside the plain assurance
    that ease follows when the ground is kept. The counsel is to stop dwelling on
    hardship and keep up the ordinary observances that steady a house. The judgements
    are bright across the board, with only going out and the month''s turn left flat.'
  zh: 开阔的一季：诗里把东海之福、山岳之寿，与「守住本分便自然平安」这句话并排放着。劝的是别再反复咀嚼自己的苦处，把日常的常例照旧做下去——家里的安稳靠的正是这些常例。庙本判词整体明亮，只有出门远行与月令的转折两处带着提醒。
