criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 亨通得自安。／作事 成者甚好。／家事 光輝門庭。／家運 吉星拱照。／婚姻 美滿大吉。／求兒
      好。／六甲 得添弄璋。／求財 黃金萬貫。／功名 祝神求佛可進。／歲君 平安。／治病 少者不畏。老險。／出外 不可。／經商 萬商雲集。／來人 月光即到。／行舟
      大好居中。／移居 兄弟和合者吉。／失物 尋在。／求雨 及時。／官事 了錢過後完局。／六畜 興旺。／耕作 早晚有收。／築室 福雙全。子孫旺。／墳墓 地勢套當。／討海
      有大財。／作塭 神指示得大財。／魚苗 大利。／月令 不遂。／尋人 得至。／遠信 速報佳音。——整签偏正（jie_yue_score +14）：通篇判词明亮，惟
      出外 不可、月令 不遂 两项留有余地，治病 一项按年纪分说。校订：末句依用户裁定取「祈保分明自平安」（别本作「得自安」），其余字句六源一致。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上大体偏正面——总类、作事、家事、家运、婚姻、子嗣、求财、功名、经商、行舟、移居、六畜、耕作、筑室、讨海、作塭、鱼苗、寻人、远信等处都在正面一侧；只有出门与月令两项留有余地，身体一项按年纪分开说。故列为本批的偏正一档。
