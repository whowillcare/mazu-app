reading_notes:
- term: 祿馬
  pinyin: lù-mǎ
  en: 'salary-and-horse: at once the two *almanac stars that mark office and income*
    and the plain sense of *advancement*; The line reads the road, not the person.'
  zh: 禄马：既指旧历书里主管官位与进项的两颗星，也指「前程上进」这个平常意思。这一句看的是路，不是人。
- term: 若得
  pinyin: ruò-dé
  en: '"if you come by": the conditional the sentence turns on; One text branch prints
    求得 (*seek and get*), and the difference decides how the lot is used: this is a
    condition, not a promise.'
  zh: ——整句就落在这个条件上。另有一路版本作「求得」（去求而得），这一字之差决定这签怎么用：它是条件，不是允诺。
- term: 中間
  pinyin: zhōng-jiān
  en: '"what lies between": at once *the middle of the matter* and *the interval of
    time*; The lot is answering the middle, which is the hard part.'
  zh: ：既指一件事的中段，也指中间那段时间。这签回答的正是最难的中段。
plain_meaning:
  en: 'The middle of a matter is the hard part, and the poem answers it with a condition
    rather than a promise: the signs of advancement are on either side of the road,
    and if help arrives, the profit and the accord arrive with it. Read it as "if",
    not as "when".'
  zh: 一件事的中段最难，这首诗给的是条件句，不是承诺：前程的吉兆就在路的两旁，若有帮手来，利与和顺也跟着一起到。把它读成「如果」，不要读成「何时」。
