criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 凡事 忍耐求和／作事 貴人利。和氣成／家事 圓滿進財／家運 瑞氣盈庭／婚姻 大吉／六甲 先男／求財 不多／功名 有望／歲君
      得利／治病 痊癒／出外 有貴人提攜／經商 大進利市／行舟 得財／移居 大吉／官事 速和公判／耕作 有收／築室 祥氣盈庭／墳墓 福人必得福地／討海 和者得大財／作塭
      獲利三倍／魚苗 大利／月令 平安吉慶／遠信 佳音速報（jie_yue_score +17）。整签偏正，唯 求財 不多 一项为上限、求兒 月光好。月暗平
      另带条件。校勘：多数决；第三句「求得貴人」经用户裁定改为「若得貴人」（本签为条件句体，与「看看祿馬拱前程」结构相合），另有三源作「求得」，差异记录在案。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词通签偏正面：家事、家运、婚姻、功名、经商、行舟、移居、耕作、水上与远信各处皆顺；求财一项另注为数额不大。文字方面，第三句按用户裁定取「若得」一路（另有三源作「求得」），本签为条件句体，两字差别影响用法，差异照实记录。
