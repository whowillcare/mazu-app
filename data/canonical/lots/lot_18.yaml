  family_home:
    en: Good air in the household and a family matter coming to a round finish.
    zh: 家里气象好，一件家事会圆圆满满地收尾。
    compliance_tag: null
  travel_moving:
    en: There are people who will look after you on the road.
    zh: 路上会有人照应你。
    compliance_tag: null
  sea_and_voyage:
    en: The water pays those who keep in accord — a steady return, not a single haul.
    zh: 水上回报那些与人保持和气的人——是细水长流的进项，不是一网大发。
    compliance_tag: null
  livelihood_and_seasons:
    en: The season brings a harvest and the work is rewarded; the returns favour the
      patient.
    zh: 这一季有收成，做工也有回报；收益偏向耐得住的人。
    compliance_tag: null
  timing:
    en: The accord becomes plain in the middle of the season — a season, never a date.
    zh: 和顺在这一季的中段显出来——讲一季，不给日子。
    compliance_tag: null
  what_to_avoid:
    en: Reading the condition as a promise; quarrelling in the middle of a matter.
    zh: 把条件读成承诺；事情做到一半就争执起来。
    compliance_tag: null
