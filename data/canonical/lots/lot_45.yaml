      難完局。拖尾／六畜 興旺／耕作 允順／築室 居之即安／墳墓 代代簪纓／討海 先無後有／作塭 後可得利／魚苗 有利可求／月令 平安／尋人 慢回／遠信 慢慢即至。总评：整签偏吉（jie_yue_score
