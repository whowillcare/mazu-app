reading_notes:
- term: 君子小人
  pinyin: jūn-zǐ xiǎo-rén
  en: 'the noble person and the petty person: the honourable and the self-serving,
    met in one room and to be handled with courtesy; small person may also mean simply
    a child, so the line can be read as the grown and the small meeting.'
  zh: 既是同处一室、要以礼相待的正人与自私之人；「小人」也可以只是指小孩，那样这一句就读成大人与小孩相遇。两读都在。
- term: 清吉
  pinyin: qīng-jí
  en: 'clear and auspicious: plain good order, without trouble; bright and settled,
    as the same word is used of a clear sky.'
  zh: 既是平顺无事的好秩序，也是像天清那样明净安定。
- term: 煩惱
  pinyin: fán-nǎo
  en: 'affliction of mind, worry: the fretting the poem tells you to put down; in
    everyday use, cares and vexations, treated here as something carried rather than
    imposed.'
  zh: 既是诗叫放下的那份操心，也是日常说的牵挂与烦扰；这里当作背在身上的东西，不是外加的。
plain_meaning:
  en: 'A ripening season: what was planted has come to fruit, and honour and comfort
    last to a good end. The counsel is to meet every kind of person with courtesy
    - high and low must deal with one another - and to stop carrying worry that no
    longer belongs to you.'
  zh: 这是一季成熟：种下的已经结成果，富贵荣华一路陪你到老。这一签的提醒是以礼待人——高与低总要彼此会面——并把不再属于你的那份忧心放下。
