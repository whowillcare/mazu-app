  source: curated
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements are positive across the board — 凡事 吉／婚姻 大吉／家運 和氣。後得祥瑞／求財
      後遇貴人大興／築室 大吉, with 後 and 漸 repeated (後科連登。尾有／漸得春風／晚有大利), so the gain is late
      rather than immediate (jie_yue_score 21)
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: The temple book is favourable across the whole of this lot — general
      affairs, undertakings, household, family fortune, marriage, children, income,
      advancement, the year's ruler, illness, travel, trade, boats, moving house,
      lost property, legal matters, livestock, field work, building, graves, sea work,
      ponds, fry, the month's season, finding people and distant news all sit on the
      positive side, with the good news arriving on the later side throughout; only
      the legal line leaves room between its two halves. We read it as favourable.
criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 吉。／作事 二次成。／家事 餘興且喜。／家運 和氣。後得祥瑞。／婚姻 大吉。／求兒 吉。／六甲
      先男後女。／求財 後遇貴人大興。／功名 後科連登。尾有。／歲君 安和。／治病 命不畏。平安。／出外 向南方遇貴人。／經商 先利平。後大財。／來人 立即到。／行舟
      漸得大財。／移居 得安／失物 月光必在。／求雨 過日自有。／官事 不畏。破財。完局。／六畜 可納。／耕作 下冬好。／築室 大吉。／墳墓 永裕後崑。／討海
      晚有大利。／作塭 和者必獲厚利。／魚苗 後得大利。／月令 漸得春風。／尋人 得回。／遠信 守候佳音。——整签偏正，好处偏晚（後／漸／晚 反复出现）；惟
      官事 不畏。破財。完局 一句里既说不怕又说破财，留有余地（jie_yue_score 21）。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上处处偏正面——总类、作事、家事、家运、婚姻、求儿、子嗣、求财、功名、岁君、治病、出外、经商、行舟、迁居、失物、官事、六畜、耕作、筑室、坟墓、讨海、作塭、鱼苗、月令、寻人、远信都落在正面一侧，只是好处的到来偏后段；官事一项在无惧与耗财之间留有余地。故列为本批的偏正一档。
provenance:
  editorial_note: '*the temple site carries a shorter group for this lot: 朱德武入寺相分明;
    崔文德胡鳳嬌到家空成婚; 沈萬三掘寶與正德君鬥法. This one is primary because the poem speaks of livelihood
    already sufficient and of meeting the bright pearl (衣祿自有餘／終遇得明珠).*'
  textual_provenance: null
  reviewed_on: '2026-10-06'
verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 勸君把定心莫虛，
    en: 'I counsel you: hold your heart steady, and do not let it run empty;'
  - line_number: 2
    zh: 天註衣祿自有餘，
    en: clothes and stipend are written in heaven's record, and there is more than
      enough;
  - line_number: 3
    zh: 和合重重常吉慶，
    en: accord upon accord — this is good fortune again and again;
  - line_number: 4
    zh: 時來終遇得明珠。
    en: when the time comes, one meets the bright pearl at last.
