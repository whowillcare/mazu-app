reading_notes:
- term: 把定
  pinyin: bǎ-dìng
  en: 'to hold firm, to hold in place: to steady your own heart; to hold a course
    or a decision fixed; both senses sit in the same phrase.'
  zh: 一是把自家这颗心拿稳，二是把方向、把决定定住；两层都在同一个词里。
- term: 衣祿
  pinyin: yī-lù
  en: 'clothing and stipend, that is one''s livelihood: the means of living, food
    and clothes provided; the temple notes that some editions read 姻緣 (marriage) here
    instead; this edition keeps 衣祿 and does not choose for the reader.'
  zh: 指衣食生计这份给养；庙本另注，有些版本这里作「姻緣」，本件依底本作「衣祿」，不为读者选边。
- term: 明珠
  pinyin: míng-zhū
  en: 'bright pearl: a treasure found at last, the object of long effort; a person
    or a match met at last; the poem does not say which.'
  zh: 既是长久用力最后寻得的宝物，也指最后遇见的人或一段好姻缘；诗里没有说是哪一个。
plain_meaning:
  en: 'A steadying lot: the poem tells someone whose heart is running hollow to hold
    firm, says the means of living are already provided, and points to accord repeated
    until the bright pearl is met. The judgements reward patience and a second attempt
    — the gain arrives after the first try, not with it — so keep the ground you have
    and let the time ripen.'
  zh: 一支让人定心的签：诗里劝的是心要拿定、不要空落，衣食这份生计本就给足了，又指着一再的和合，直到遇见那颗明珠。判词奖的是耐心和第二回——好处是第一趟之后才到的，不是随着第一趟来；守住手里的地，让时间来成全。
