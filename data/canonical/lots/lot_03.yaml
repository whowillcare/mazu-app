guidance:
  relationships:
    en: A strongly supported match, with accord heaped on accord; the work is to keep
      faith while it settles.
    zh: 这一签对婚配支持很足，和合一层叠一层；要做的是在落定之前守住信义。
    compliance_tag: null
  career:
    en: Advancement comes by stages and on a later round; a steady position serves
      better than a hurried push.
    zh: 功名是一段一段来、落在后头那一科；稳稳守着位子，比赶着使劲好。
    compliance_tag: null
  money:
    en: The judgements place the gain where you already stand, arriving with help
      and after a first pass. *(Not financial advice.)*
    zh: 判词把进项放在你已站的地方，是带着贵人、过了头一趟才到的。（非财务建议。）
    compliance_tag: not_financial_advice
  health:
    en: The judgements read no danger to life and a return to calm; keep anything
      ongoing with a professional. *(Not medical advice.)*
    zh: 判词上命无碍、会回到平安；手上还在治的，继续交给有资质的专业人士。（非医疗建议。）
    compliance_tag: not_medical_advice
  family_home:
    en: The household runs on good temper — harmony first, good fortune after.
    zh: 这一家靠的是好脾气——先和气，后祥瑞。
    compliance_tag: null
  travel_moving:
    en: Going out to the south is favoured and is said to bring help; a change of
      residence settles well.
    zh: 往南出门是好的，说是能遇贵人；迁居也落得安稳。
    compliance_tag: null
  sea_and_voyage:
    en: Gain on the water comes late but large; work the season through rather than
      in one throw.
    zh: 水路的好处来得晚、来得大；按整季做，不要一把押上。
    compliance_tag: null
  livelihood_and_seasons:
    en: Stock, ponds and fish fry all read profitable, and the later part of the farming
      year is the better one.
    zh: 六畜、作塭、鱼苗都读得有利可图，农事里后半程更好。
    compliance_tag: null
  timing:
    en: The movement is gradual — accord first, the pearl later; no date is given.
    zh: 动静是渐进的——先和合，后明珠；不给日期。
    compliance_tag: null
  what_to_avoid:
    en: Doubt and second-guessing; expecting the result on the first attempt.
    zh: 起疑、反复三心二意；指望第一趟就见结果。
    compliance_tag: null
  reassurance:
    en: This is a warm lot; its only demand is patience.
    zh: 这是一支暖签；它要的只是耐心。
    compliance_tag: null
stories:
- title:
    zh: 沈萬三掘寶與正德君鬥法
    en: Shen Wansan Digs Up Treasure and Matches Wits with the Zhengde Emperor
  is_primary: true
  is_variant: false
  cross_reference_lot: null
  narrative:
    zh: 沈万三是明代初年江南有名的巨富，苏州、南京一带流传许多关于他的说法。民间说，他起初靠打鱼为生，后来挖到一批埋在地下的财宝，一下子发了大财，从此成了江南一带的首富。他家藏着一只聚宝盆。旧话里说，往盆里放金玉，盆就满起来，所以他的钱财多得数不清。南京城南修筑城墙的事，也说和他出的钱有关，他在这上头出力不小。民间又传说，后来有位皇帝南巡到江南，听说他富有，便同他斗法，各出奇物比试高低。这一段在民间流传也很广。
    en: Shen Wansan was a famous rich man of Jiangnan in the early Ming dynasty. In
      the Suzhou and Nanjing regions many sayings grew up about him. Folks said he
      first made his living by fishing. Later he dug up a batch of treasure buried
      in the ground. He grew rich at once and became the richest man in Jiangnan.
      His family kept a treasure-gathering basin. Old tales say that gold and jade
      put into the basin made it fill up. So his money was too much to count. The
      building of the city wall south of Nanjing is also said to have been tied to
      money he gave. He did a great deal there. Folks also tell that a later emperor
      toured south to Jiangnan. He heard that Shen Wansan was rich and matched wits
      with him. Each brought out rare things to compare, one against the other. This
      tale also spread widely among the common people.
  poem_connection:
    zh: 签诗“天注衣禄自有余”正合沈万三聚宝盆、掘藏发财之说；“时来终遇得明珠”则对应他掘得窖藏那一节。
    en: The poem says heaven assigns clothing and income so there is always more than
      enough, which fits Shen Wansan's treasure basin and dug-up hoard; the line about
      finding a pearl at last matches the buried treasure he digs out.
- title:
    zh: 周德武入寺相分明
    en: Zhou Dewu Enters the Temple and Sees Clearly
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 周德武是永嘉人，家里穷，靠打柴养活母亲，为人孝顺。他和张瑞英早有姻缘，传说由月老牵线，两人在荒山里见了面。里正是管一乡事务的小吏，却诬告他拐带妇女，后来又有人从中陷害，夫妻二人都被充军到山东。颠沛的路上，张瑞英进了一座寺庙出家为尼，寺庙是僧人修行居住的地方，夫妻从此分开。过了些时候，机缘凑巧，两人在同一座寺里相遇，当面认出了彼此。当初分离的缘由、所受的冤屈，到这时都讲明白了。后来冤情得以洗清，夫妻重新团聚，两地的事才算了结。
    en: Zhu Dewu was a man of Yongjia. His family was poor, and he supported his mother
      by cutting firewood, and he was a dutiful son. He and Zhang Ruiying had long
      been joined in marriage. In the tale the match was made by the Old Man of the
      Moon, and the two met in the wild hills. The lizheng, a petty officer in charge
      of a district, falsely accused him of carrying off a woman. Later others plotted
      against them too, and husband and wife were both sent into exile in Shandong.
      On the hard road Zhang Ruiying entered a temple and became a nun. A temple is
      the place where monks and nuns live and practice, and from then on the couple
      were apart. Some time later chance brought them together in the same temple,
      and they knew each other face to face. The reason they had been parted and the
      wrongs they had suffered were all made clear then. Later the false charge was
      cleared, husband and wife were reunited, and the affairs of the two places were
      settled.
  poem_connection:
    zh: 签诗说时运来时终于得到明珠。夫妻离散多年又在寺中相认，就像重得明珠一样。
    en: The lot poem says that when the time comes, a bright pearl is gained at last.
      The couple, long parted, met again in the temple, like a pearl found again.
- title:
    zh: 崔文德胡鳳嬌到家空成婚
    en: Cui Wende and Hu Fengjiao Reach Home with No Wedding
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 胡凤娇和母亲文氏寄住在陵州的表兄崔文德家里。母女两人相依为命，寄人篱下。崔文德一心想娶表妹，对姨母百般孝敬。有一回借着看海棠花的机会，他当面向凤娇提亲。凤娇心意坚决，不肯改口，崔文德只好把婚书退回去。母亲过六十大寿时，凤娇绣了一幅王母蟠桃图当作贺礼。崔文德却当着众人的面说，这是自己的妻子胡氏绣的。众人纷纷称好，婚事又被提了起来。凤娇还是不肯回心，最后投江自尽，以成全自己的名节。她被接到崔家，这门亲事终究没有成。
    en: Hu Fengjiao and her mother, whose family name was Wen, were staying with her
      cousin Cui Wende in Lingzhou. Mother and daughter depended on each other and
      lived under another family's roof. Cui Wende wanted to marry his cousin, and
      he was all courtesy toward his aunt. Once, using the chance of looking at crab-apple
      blossoms, he proposed to Fengjiao face to face. Fengjiao's mind was firm and
      she would not change her word, so Cui Wende had to return the marriage contract.
      When her mother turned sixty, Fengjiao embroidered a picture of the Queen Mother
      of the West with peaches of immortality as a birthday gift. Cui Wende, in front
      of everyone, said it was embroidered by his own wife, of the Hu family. The
      guests praised it, and the marriage was raised again. Fengjiao still would not
      change her heart, and in the end she threw herself into the river to keep her
      honor. She was brought to the Cui house, but the match never came to anything.
  poem_connection:
    zh: 这一签说把定心意、莫要心虚，正配胡凤娇不改其志、到家成婚却终究落空。
    en: This lot says hold your resolve and do not let your heart waver. It fits Hu
      Fengjiao refusing to change her mind and the wedding at the house coming to
      nothing.
- title:
    zh: 石崇得綠珠
    en: Shi Chong Obtains Green Pearl
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 绿珠是白州人，生得美貌，又善于吹笛。石崇是西晋的巨富，做过荆州刺史，家财雄厚，在洛阳建了一座金谷园，园里宾客往来，是洛阳有名的地方。明珠是当时难得的宝物，他用几斛明珠买下绿珠做妾，对她十分宠爱。当时赵王司马伦把持朝政，他的党羽孙秀向石崇索取绿珠，石崇不肯给。孙秀就劝司马伦杀掉石崇，假传诏令来抓人。石崇正在楼上宴饮，被抓时说自己获罪，全是因为绿珠。绿珠听了，从楼上跳下而死。石崇一家后来也都遭到杀害。
    en: Green Pearl was a woman of Baizhou. She was beautiful and skilled at the flute.
      Shi Chong was a man of great wealth in the Western Jin. He had served as inspector
      of Jingzhou, and his fortune was huge. He built Golden Valley Garden in Luoyang.
      Guests came and went there, and it was a famous place in the city. Pearls were
      a rare treasure in those days. He bought Green Pearl as a concubine for several
      measures of pearls. He was very fond of her. At that time Prince Sima Lun of
      Zhao held the court in his hand. His follower Sun Xiu asked Shi Chong for Green
      Pearl, and Shi Chong refused to give her up. Sun Xiu then urged Sima Lun to
      put Shi Chong to death. He had an order forged to arrest him. Shi Chong was
      feasting upstairs. When he was taken, he said that he had fallen into trouble
      entirely because of Green Pearl. When she heard this, she threw herself from
      the upper floor and died. Shi Chong's whole household was later put to death
      as well.
  poem_connection:
    zh: 这一签的签诗说把心把定，命中该有的衣禄自然有余，时候到了终会遇到明珠。题面就是“得绿珠”，讲的正是以明珠换人。
    en: The poem says to set your heart firm; the clothes and food you are owed come
      to more than enough, and in time you meet the pearl. The title itself is obtaining
      Green Pearl.
- title:
    zh: 鄭元和中舉為官
    en: Zheng Yuanhe Passes the Examination and Takes Office
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 郑元和是荥阳公的儿子，到京城长安应试。他爱上长安的名妓李娃，把钱财花光了，被鸨母设局赶出门，流落在丧事铺子里做挽郎，替人唱挽歌。父亲进京得知，气得把他打得几乎死去。郑元和醒后沦为乞丐，一路讨饭，讨到李娃门前。李娃念着旧情，替自己赎了身，租屋住下，替他调养身体。等他身强体健，又买书劝他读书，陪他读到深夜。郑元和接连考中，做了成都府的参军。李娃自请退为婢妾，郑元和不肯；后来得到父亲的许可，两人成婚，李娃受封汧国夫人。
    en: Zheng Yuanhe was the son of the Duke of Xingyang and went to the capital Chang'an
      for the examinations. He fell in love with Li Wa, a famous courtesan of Chang'an,
      and spent all his money. The madam set a trap and had him thrown out. He drifted
      into an undertaker's shop and worked as a mourner, singing laments for the dead.
      His father came to the capital, learned of it, and beat him so badly that he
      nearly died. Zheng Yuanhe woke up a beggar and lived by asking alms from door
      to door. One day he begged at Li Wa's gate. Li Wa remembered their old bond,
      bought her own freedom, rented a house, and nursed him back to health. When
      he had recovered, she bought books and urged him to study, sitting with him
      late into the night. Zheng Yuanhe passed the examinations one after another
      and became an army administrator in the Chengdu prefecture. Li Wa asked to step
      down to the rank of a maidservant concubine, and he refused. Later, with his
      father's consent, the two married, and Li Wa was given the title Lady of Qian.
  poem_connection:
    zh: 签诗说把定心莫虚、时来终遇明珠；郑元和苦读登第、终得显达，正合这一层。
    en: The poem says to set the heart firm and not be anxious, and that in time one
      meets the pearl. Zheng Yuanhe studied through hardship, passed, and rose, which
      fits.
