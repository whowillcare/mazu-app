register:
  level: unfavourable
  source: curated
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements run negative almost throughout - 作事 難成／家事 恐防大害／婚姻
      不吉。女帶殺氣／求財 不得／功名 無／出外 被人欺／經商 呆人欺。難如意／行舟 無利可得。了財帛／移居 大不好／官事 被官欺。大了錢／築室 不可。犯殺／討海
      無利可得 (jie_yue_score -6). The single opening is 凡事 後成吉, with 月令 九不畏。防人欺.
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: The temple judgements hold back across undertakings, the household,
      marriage, money, advancement, travel, a change of dwelling, lawsuits, building
      and work on the water; the household entry adds trouble from people. The single
      door left open is the general entry, which turns good later. The lot is read
      protectively.
