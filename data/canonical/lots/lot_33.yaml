  source: curated
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements run positive with a caution against haste — 凡事 不可急進／作事
      二次成功／婚姻 大吉／行舟 把定未遭風／月令 不安 (jie_yue_score +12)
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: 'We read this lot as mixed: marriage and the household line stand strong,
      and income and undertakings do arrive on a second attempt, but health, the month''s
      turn and distant news all carry delay. The pattern is support with delay, so
      we read it as mixed and the counsel is to avoid haste.'
criteria:
