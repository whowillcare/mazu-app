verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 欲去長江水闊茫，
    en: You would set out on the Long River, wide and vague;
  - line_number: 2
    zh: 行舟把定未遭風，
    en: hold the boat steady and you meet no wind;
  - line_number: 3
    zh: 戶內用心再作福，
    en: keep your mind on the house and make your merit there again;
  - line_number: 4
    zh: 看看魚水得相逢。
    en: look — the fish and the water do meet.
keywords:
  favourable:
    en:
    - holding steady
    - the fit arriving in time
    - patience inside the house
    - a second attempt
    zh:
    - 把稳不动
    - 契合到时候会到
    - 在家里用心耐守
    - 再来一次
  guarded:
    en:
    - pushing out ahead of the wind
    - expecting the first attempt to hold
    - forcing a fit that is already on its way
    zh:
    - 赶在风前头出去
