reading_notes:
- term: 把定
  pinyin: bǎ-dìng
  en: '"hold steady": at once *keeping the tiller* and *keeping your own counsel*;
    The protection in this line is in the holding.'
  zh: 既是把住舵，也是自己心里有主张；这一句的保护就在「把住」两个字上。
- term: 戶內
  pinyin: hù-nèi
  en: '"within the door": at once *inside the household*; *the private side of the
    matter*.'
  zh: 既指家门以内，也指这件事私下、家中的那一面。
- term: 魚水得相逢
  pinyin: yú-shuǐ-dé-xiāng-féng
  en: 'fish and water meet: here the fit does arrive — the same figure that Lot 23
    refuses; Read the two lots against each other and the difference is the season,
    not the wish.'
  zh: 在这里是真的会相逢——同一个意象在第 23 签是落空的。两签对着看，差的是时节，不是心愿。
plain_meaning:
  en: 'The water is wide, but this poem does not send you across it: hold the boat
    steady, keep your counsel at home, and the fit you are worried about does arrive.
    It is a lot about not hurrying — the second attempt is the one that works.'
  zh: 水面很宽，但这一签并不叫你渡过去：把船把稳，在家里守住自己的主张，你担心的那个契合是会到的。这是一支讲不要急的签——第二次尝试才成。
