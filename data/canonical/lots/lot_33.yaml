      望後科／出外 平安／經商 安分待時／移居 二次成吉／行舟 把定未遭風／六畜 小吉／耕作 有收成／墳墓 地運小吉／討海 得財／作塭 漸漸得財／魚苗 好／月令
      不安。总评：整签偏吉（jie_yue_score +12），主调是「不可急進」；治病 拖尾。破財、月令 不安两处是提醒。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 我方读作 mixed：婚姻与家宅偏强，求财与作事要第二次才顺；治病、月令与远信三处带迟滞。支持里夹着拖力，故读作 mixed。
