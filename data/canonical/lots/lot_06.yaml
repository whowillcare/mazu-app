      sea work, ponds, fry, the month's season, finding people, and distant news;
      only the child line is left open. We read it as unfavourable.
criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 待望／作事 不成局／家事 家庭相爭／家運 有怪必防／婚姻 不宜／求兒 不可／求財 空有／功名
      難望／歲君 破財。二七月令不吉／治病 邪作病。險不吉／出外 無貴人／經商 財本耗散／行舟 不好／移居 且慢／失物 運如此。路難逢／官事 了錢。拖尾／六畜
      不佳／耕作 無收／築室 犯凶星／墳墓 地運不佳／討海 邪祟不利／作塭 失利／魚苗 失利了錢／月令 不遂／尋人 遲遇／遠信 無望——整签偏负，唯 六甲 男高貴。晚投枝
      一项留有余地（jie_yue_score -17）。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上差不多处处偏阻——总类、作事、家事、家运、婚姻、求儿、求财、功名、岁君、治病、出外、经商、行舟、移居、失物、官事、六畜、耕作、筑室、坟墓、讨海、作塭、鱼苗、月令、寻人、远信都在负面一侧；唯子嗣（六甲）一项留有余地。故列为本批的偏负一档。
