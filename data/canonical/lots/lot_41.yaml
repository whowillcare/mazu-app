criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（庙本解曰原文，照抄）：凡事 和者吉／作事 難成／家事 克振家聲／家運 漸得平安／婚姻 夙世結成雙／求兒 不可／六甲
      得添弄璋／求財 難。酉戌日即成／功名 無／治病 拖尾。戌日不畏／出外 東北方好／經商 遲有利／行舟 無財可得／官事 勝局／六畜 不好／耕作 平平有利／討海
      無利時待／魚苗 不好／月令 不遂／遠信 酉戌日至。总评：平和偏守（jie_yue_score 10）——多数类目取守，惟凡事「和者吉」、婚姻「夙世結成雙」、官事「勝局」、家事「克振家聲」四处留亮。正面的开关系在「和」上，不在时节上。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在多数类目上取守势，求财、功名、行舟、六畜、鱼苗、月令都指向同一个方向；同时凡事、婚姻、官事与家事四项留有亮处。正面与否系在「和」上——判词把整签挂在和气之上，而不是挂在季节上。这是一支吉凶相半的平签，按先保护后行动读。
