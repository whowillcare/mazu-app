reading_notes:
- term: 月中和
  pinyin: yuè-zhōng-hé
  en: 'the mild middle of the month: the month at its balanced midpoint; a situation
    that has reached equilibrium, which is not the same as success.'
  zh: 既是月到中旬的和缓，也指事情到了均势——均势并不等于成事。
- term: 改變顏色
  pinyin: gǎi-biàn-yán-sè
  en: 'to change one''s countenance: to change the face you show the world, that is,
    your manner; literally to change colour, as a banner or a set of goods is changed.'
  zh: 字面是换颜色（旗号、货物都可以换色），引申是改换待人处事的面貌。
- term: 重勞
  pinyin: zhòng-láo
  en: 'heavy toil: labour repeated over again; a doubled burden; the line names effort
    rather than harm.'
  zh: 既是力气一层层加上去的劳作，也是加倍的重担；这句点的是辛劳，不是祸害。
plain_meaning:
  en: 'A season of steady, unglamorous work. It comes to a mild balance and then asks
    for care: the difficulty named here is toil rather than disaster, and the risk
    is in slackening once the work turns easy. Change how you carry yourself, keep
    to the work in front of you, and do not read a mild stretch as a finished success.'
  zh: 一季平稳而不显眼的劳作：事情走到月中转为和缓，过了那一段要留神别往高处硬追。这签点的是劳苦，不是灾祸；常见的失手是在顺处自满。调整自己应对的样子，守好眼前的活计，别把一段和缓当成已经成了。
