    zh: 家里眼下有些不安；把日常作息守住，等它过去。
    compliance_tag: null
  travel_moving:
    en: The poem says do not set out; travel after the turning.
    zh: 诗里说不要出门；等转机过后再走。
    compliance_tag: null
  sea_and_voyage:
    en: Nothing on the water this half — keep the boats safe rather than busy.
    zh: 这半程水上没有进项；让船安稳待着，不必忙着出港。
