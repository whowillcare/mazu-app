reading_notes:
- term: 靈雞
  pinyin: líng-jī
  en: 'the numinous cock: at once *the actual bird* and *the omen of daybreak*; The
    allusion is the cock-crow that opened the pass for Lord Mengchang''s escape.'
  zh: 有灵性的鸡：既指那只真实的鸡，也指天亮的兆头。典出孟尝君出关时靠一声鸡鸣叫开关门。
- term: 子丑寅
  pinyin: zǐ-chǒu-yín
  en: 'the first three branches, the small hours: an *order of time*, not a calendar;
    The poem says "in that order", not "on that day".'
  zh: 十二支的头三位，即深夜到天将明那一段：它讲的是时间上的先后次序，不是某一日。诗里说「按这个次序」，不是说「就在那一天」。
- term: 漸漸
  pinyin: jiàn-jiàn
  en: '"by degrees": the one word that decides how the lot is used; The clearing is
    real and it is gradual.'
  zh: ——决定这签怎么用的就是这一个词。天亮是真的，而它是渐进的。
plain_meaning:
  en: 'The night is not over, but it is already thinning: the cock has crowed, the
    cloud is breaking, and the turn comes by degrees rather than at once. Until it
    comes, the poem is a warning about the first half of the season.'
  zh: 夜还没有过去，但已经在变薄：鸡叫了，云在裂开，转机是一层层来的，不是一下就到的。在它到之前，这首诗讲的是这一季的前半程要当心。
