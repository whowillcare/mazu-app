reading_notes:
- term: 舊恨
  pinyin: jiù-hèn
  en: 'old rancour: a grievance carried over from the past; a matter left unresolved
    from before; the poem names the wound, not the one who caused it.'
  zh: 既指从前带下来的怨，也指一件一直没解开的旧事；籤文只点出这道伤口，没有说是谁造成的。
- term: 和合
  pinyin: hé-hé
  en: 'to bring into accord: peace made between people; the joining of a marriage
    - the same word stands in the judgement 婚姻 大吉.'
  zh: 既可指人跟人讲和，也指婚姻的合成——同一个词在解曰的婚姻一项里再次出现，两边都算数。
- term: 龍蛇交會
  pinyin: lóng-shé-jiāo-huì
  en: 'dragon and snake meet: a time-image, the chen and si positions of the calendar;
    any meeting of parties that do not match; the poem does not say which comes first.'
  zh: 既是一个时象，指历法上辰、巳这两个位置；也可指本来不相合的两方碰在一处；籤文没说谁先到。
- term: 作福
  pinyin: zuò-fú
  en: 'to make merit: offerings made to the deity; good works done for others; the
    line sets both against the old grudge.'
  zh: 既可指给神明的供献祈福，也可指为别人做的善事；这一句把两者都拿来对着旧怨说。
plain_meaning:
  en: 'A season with an old quarrel still in it and a household so far spared: nothing
    is broken, but the poem asks for watchfulness and for quietly done merit rather
    than for pressing on. The judgements favour plain, steady effort - thrift, patience,
    keeping the peace - and place the opening at the meeting of the dragon and snake
    positions.'
  zh: 这一季里还留着旧日的争执，而家宅至今无恙：眼下并没有破，籤文要的是提防，以及静静地做些善事，不是硬往前推。解曰偏向平实的稳功夫——节俭、耐心、守住和气——并把转机放在龙蛇相交的那个位置上。
