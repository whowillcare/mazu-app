      了錢／月令 破財有口舌／遠信 無望（jie_yue_score −13）。整签偏负，唯 築室 且慢也可、墳墓 地勢適當、求雨 尚未。自有、尋人 漸回 三处留有余地。校勘：多数决；诗文第四字「相愛誤」为用户裁定保留，另有一路版本作「相愛愉」（temple01
      好廟網、feishuai 作「愉」），定本从裁定，不改字。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在婚姻、子嗣、求财、功名、家运、出行、经商、水上作业与月令各处皆受阻，我方读作 unfavourable。；只有居住、丧葬与「稍缓亦可」一处留有余地。底本文字另有一路版本作「相愛愉」，我方按用户裁定与全诗语气保留「誤」，异文照实记录在案。
