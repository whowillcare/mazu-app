reading_notes:
- term: 相愛誤
  pinyin: xiāng-ài-wù
  en: '"loving, and mistaken": at once *an affection that errs* and *a meeting that
    was a mistake to make*. The dictionary text prints 誤; one branch prints 愉 (*pleased*),
    which the last line refuses. We keep 誤 and show the variant rather than smooth
    it away.'
  zh: ：既指一份用错了地方的情意，也指一场本就不该凑成的相会。字典一路作「誤」；另有一路版本作「愉」（愉悦），末句不接受这个读法。我方保留「誤」，并把异文照实列出，不替读者抹平。
- term: 背後看
  pinyin: bèi-hòu-kàn
  en: '"looking behind you": at once *suspicion of someone at your back* and *the
    poem''s own backward glance*; The line is a caution, not an accusation.'
  zh: ：既指疑心身后有人，也指这首诗自身的回望。这一句是提醒，不是指控。
- term: 與我卻無干
  pinyin: yǔ-wǒ-què-wú-gān
  en: '"has nothing to do with me": the line marks a *separation*. It states distance;
    it is not a threat.'
  zh: ：这句标示的是一种分开。它只陈述距离，不是威胁。
plain_meaning:
  en: 'Dragon and tiger lodge in the same hills and do not stay companions: intimacy
    here is already turning into distance, and suspicion only hurries it. The counsel
    is to stand on your own ground, keep the matter quiet, and let what is ending
    end without a quarrel.'
  zh: 龙与虎同住一山，却留不住彼此作伴：这一阵的亲近正在转为疏远，猜疑只会让它走得更快。给出的做法是守住自己的本分、把事情放安静，让该结束的关系结束时不必起争执——诗里那句「他日与我却无干」，说的是距离，不是恐吓。
