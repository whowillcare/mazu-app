stories:
- title:
    zh: 龍虎相會
    en: Dragon and Tiger Meet
  is_primary: true
  is_variant: false
  cross_reference_lot: null
  narrative:
    zh: 龙和虎都是山林里最强的一对猛兽：龙腾云降雨，虎长啸生风。旧时把两股强横的力量碰到一起，就叫作龙虎相会。这一则讲的就是这样一个场面。深山人迹不到，只有风声和水声。两强相邻，谁也不肯让谁。龙与虎同处一座深山，一个在前，一个在后，彼此相随。走在后面的人总忍不住回头张望，怕同伴从背后动手。这两股力量本来相处得好，一旦起了猜疑，先前的情分就变成了过错。到那时候，彼此再无干系。题名取的是龙虎并处、由合到分的一层意思，谁强谁弱、谁先谁后，都在这深山里见分晓。
    en: The dragon and the tiger are the strongest pair of beasts in the mountain
      forests. The dragon rises on clouds and brings rain. The tiger roars long and
      raises wind. In old times, when two harsh powers came against each other, people
      called it a meeting of dragon and tiger. This entry shows just such a scene.
      Deep in the mountains no human track is found. Only the sound of wind and the
      sound of water. The two strong ones live side by side, and neither yields to
      the other. Dragon and tiger share one deep mountain, one ahead and one behind,
      each following the other. The one who walks behind cannot help turning his head,
      for fear his companion might strike from the back. The two powers once got along
      well. Once suspicion is roused, the former goodwill turns into a fault. By then
      they have nothing to do with each other. The title takes the sense of dragon
      and tiger placed together, moving from union to separation. Who is strong and
      who is weak, who leads and who follows, all come clear in these deep mountains.
  poem_connection:
    zh: 签诗写龙虎相随在深山，君尔何须背后看。题名“相会”与签诗“相随”“相爱误”同属龙虎并处、由合到分的语意。
    en: The lot poem has dragon and tiger following each other in deep mountains and
      asks why one looks behind. The title's meeting shares that sense of two powers
      together, moving from union to separation.
- title:
    zh: 項王被圍垓下
    en: Xiang Yu Surrounded at Gaixia
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 项羽是秦朝末年起义的首领，自称西楚霸王。他跟刘邦争夺天下，屡次交战，最后兵败，退到垓下，被汉军和各路诸侯的军队团团围住。兵少，粮也尽了。夜里，四周的汉营都唱起楚地的歌。项羽带八百多名壮士趁夜向南突围，渡过淮河时身边只剩一百多人。走到阴陵，他迷了路，向一个种田的老人问路，老人指错方向，一行人陷进沼泽，被汉军追上。再往东走，到东城时只余下二十八骑。最后到乌江边，乌江的亭长备好船，劝他渡江回江东。项羽不肯，下马步战，身上受了十多处伤，自刎而死。
    en: Xiang Yu was a leader of the uprising at the end of the Qin dynasty. He called
      himself the Hegemon King of Western Chu, and he fought Liu Bang for the realm.
      After many battles he was defeated and fell back to Gaixia, where the Han army
      and the armies of the other lords closed around him. His men were few and the
      food was gone. At night, from every Han camp around them, the songs of Chu were
      sung. Xiang Yu broke out southward in the dark with more than eight hundred
      picked men. By the time he crossed the Huai River only about a hundred were
      left. At Yinling he lost the road and asked an old farmer for directions. The
      man pointed the wrong way. The party rode into marshland and the Han troops
      caught up. Going further east, at Dongcheng only twenty-eight riders remained.
      At last he reached the bank of the Wu River. The river warden there had a boat
      ready and urged him to cross back east. Xiang Yu refused. He got down, fought
      on foot, took more than ten wounds, and cut his own throat.
  poem_connection:
    zh: 签诗写深山被围、不必回头张望；项羽垓下受困、四顾无援，正是这一景。
    en: The poem pictures a deep mountain surround and says there is no need to look
      back. Xiang Yu trapped at Gaixia, with help nowhere in sight, is exactly that
      scene.
- title:
    zh: 景泰君重病
    en: Emperor Jingtai Falls Gravely Ill
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 明朝正统年间，皇帝英宗亲自领兵去打北方的瓦剌，兵败被俘。朝中另立他的弟弟朱祁钰为帝，就是景泰帝。后来英宗被放回，安置在南宫，形同幽禁。景泰帝在位时想换掉太子，改立自己的儿子，儿子不久夭折。景泰帝晚年病重，卧床不能上朝。大臣石亨、徐有贞、曹吉祥见机密议，夜里带兵进南宫，拥英宗到奉天殿复位。事成之后，景泰帝被废为郕王，不久死去，英宗重掌大位。当年拥立英宗的人受赏，兵部尚书于谦等人却被加上谋反的罪名处死。
    en: During the Zhengtong era of the Ming dynasty, Emperor Yingzong led an army
      north in person against the Oirat and was defeated and taken prisoner. The court
      then put his younger brother, Zhu Qiyu, on the throne as Emperor Jingtai. Yingzong
      was later released and lodged in the Southern Palace, where he lived much like
      a prisoner. Jingtai wanted to set aside the heir and make his own son crown
      prince, but the boy soon died. In his last years Jingtai fell gravely ill and
      could no longer hold court. Three ministers, Shi Heng, Xu Youzhen and Cao Jixiang,
      met in secret. They took soldiers into the Southern Palace at night and brought
      Yingzong to the Hall of Heavenly Favor to take back the throne. Once the move
      succeeded, Jingtai was reduced to Prince of Cheng and died soon after, and Yingzong
      ruled again. Men who had backed Yingzong received rewards, while Yu Qian, the
      minister of war, and others were put to death on a charge of treason.
  poem_connection:
    zh: 这一签写大势在暗中翻转、局中人背后受制，正扣签诗“龙虎相随在深山，君尔何须背后看”。
    en: A lot about power shifting in the dark, with those involved held from behind,
      fits, like the poem's dragon and tiger deep in the mountains.
- title:
    zh: 龍虎相鬥
    en: Dragon and Tiger Fight
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 这一题只画一个场面：深山里有龙，也有虎。两样都是极强的东西，各占一段山、一段水，谁也不肯让路。山里的路只有一条，前头有龙，后头有虎，走在中间的人回头看，也还是这两样。龙与虎在山中本来各有去处，硬凑到一处，就免不了相争相斗。斗起来的时候，两方都强，谁也压不住谁，看着像是并立，实则互相牵制。签诗说“龙虎相随在深山，君尔何须背后看”，讲的就是这个处境：人夹在两种强力的中间，前有前者，后有两者的来路，回头再看也看不出个所以然。深山里的这一幅景象就是故事的全部：一龙一虎，一前一后，各不相让。
    en: 'The scene is a single one: in the deep mountains there is a dragon, and there
      is also a tiger. Both are very strong things. Each holds a stretch of mountain
      and a stretch of water, and neither yields the road. There is only one road
      in the hills, dragon in front and tiger behind. A person walking between them
      looks back and finds the same two. Dragon and tiger each have their own place
      in the mountains. Forced into one spot, they cannot help coming to blows. When
      they fight, both are strong and neither can press the other down. It looks like
      standing side by side, but is really each holding the other back. The poem says,
      dragon and tiger go together in the deep mountains, why should you look behind
      you. That is just this position. A person is caught between two strong forces,
      one ahead and one behind, and finds nothing to learn by turning his head. This
      one sight is the whole story: one dragon, one tiger, one ahead and one behind,
      neither giving way.'
  poem_connection:
    zh: 签诗首句写“龙虎相随在深山”，故事题就从这一句里取“龙虎相斗”四字为名，两者共用龙虎这一语汇。
    en: The poem's first line puts dragon and tiger together in the deep hills; the
      title takes its two beasts from that line, so both share the same pair.
