reading_notes:
- term: 得意
  pinyin: dé-yì
  en: 'coming into one''s own: getting what one wanted; being at ease with oneself;
    the phrase carries both success and satisfaction.'
  zh: 既指得偿所愿、事情办成，也指心里自在称意；这一复词两层都带着，不必只取一层。
- term: 身顯變
  pinyin: shēn-xiǎn-biàn
  en: 'the person becomes visible, and shifts: standing and reputation become apparent;
    one''s own circumstances change; the Chinese names no agent.'
  zh: 说的是本身显了出来、并且起变化：既指身份与名声变得明显，也指自身的处境转了；中文原句没有点出是谁在变。
- term: 決意
  pinyin: jué-yì
  en: 'the settling of intent: a decision taken and held; the resolve that keeps a
    decision on course.'
  zh: 是把心意定下来：既指一次做成的决定，也指让这个决定一路走下去的那份坚持。
plain_meaning:
  en: 'A season of rising fortune: the position improves, the name becomes visible,
    and the road ahead is described as light. The reservations are at the edges -
    friction in talk, small losses where disputes arise. The counsel is to decide
    cleanly and keep your conduct clean, which is what this lot makes the luck rest
    on.'
  zh: 运势往上走的一季：身份地位见好，名头显了出来，前面的路被说成轻省的。留的余地都在边角上——口舌上的摩擦，争端里折掉的小钱。劝的是把决定干脆定下、把行止守干净；这一签正是把运气搁在这上头。
