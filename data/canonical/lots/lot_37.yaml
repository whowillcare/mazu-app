    evidence: The temple book runs largely positive here - general affairs, undertakings,
      household, family fortune, marriage, children, income, advancement, the year's
      ruler, going out, trade, boats, moving house, livestock, field work, building,
      graves, sea work, ponds, fry, the month's season, finding people, and distant
      news all sit on the good side; only lost property and legal matters run against,
      and the general and undertaking lines each carry a small delay. We read it as
      favourable.
