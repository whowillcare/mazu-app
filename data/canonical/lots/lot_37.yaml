verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 運逢得意身顯變，
    en: Fortune turns your way and you come into your own, your name made visible;
  - line_number: 2
    zh: 君爾身中皆有益，
    en: everything within your own keeping turns to good;
  - line_number: 3
    zh: 一向前途無難事，
    en: the road ahead holds nothing hard for you;
  - line_number: 4
    zh: 決意之中保清吉。
    en: keep your resolve settled, and the outcome stays clear and auspicious.
