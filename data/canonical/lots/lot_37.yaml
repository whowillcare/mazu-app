      有利可得。／移居 好吉。／失物 難尋。／求雨 不日到。／官事 破財。結局。／六畜 適宜吉昌。／耕作 平平。有收。／築室 清吉。／墳墓 得其所哉。／討海
      和大利。漸得進。／作塭 漸得利。／魚苗 漸好。／月令 漸好。／尋人 盡心得回。／遠信 佳音速至。——整签偏正（jie_yue_score +18）：通篇判词偏正面，惟
      失物 難尋、官事 破財。結局 两处偏阻；凡事「有錢。拖尾」与作事「可成。有口舌」各留一条尾巴。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上大体偏正面——总类、作事、家事、家运、婚姻、子嗣、求财、功名、岁君、出外、经商、行舟、移居、六畜、耕作、筑室、坟墓、讨海、作塭、鱼苗、月令、寻人、远信等处都在正面一侧；只有失物与官事两项偏阻，总类与作事各带一条小尾巴。故列为本批的偏正一档。
