reading_notes:
- term: 變怪
  pinyin: biàn-guài
  en: '"strange turns": at once *surprising bad news* and *the odd shape a situation
    takes before it settles*; the poem treats both as knowable in time.'
  zh: 既指突然传来的坏消息，也指事情在定下来之前那副古怪的样子；诗里说这两种都会随时间变得可看清。
- term: 脫出
  pinyin: tuō-chū
  en: '"to slip out of": escape from trouble *and* the slow emergence of something
    good; the line means emergence, not flight.'
  zh: 既是从麻烦里脱身，也是好东西慢慢浮出来；这一句说的是浮现，不是逃走。
plain_meaning:
  en: 'The way is strange before it is clear: friction and odd turns give way to accord
    and calm, if you stop scheming over what needs no scheming. Emergence comes gradually,
    not in one movement.'
  zh: 路是先怪后明的：摩擦与怪变让位于和合与太平——只要在对不需要心机的事情上停止算计。脱出是渐渐来的，不是一步到位。
