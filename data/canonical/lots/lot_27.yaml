reading_notes:
- term: 寬心
  pinyin: kuān-xīn
  en: 'to set the heart at ease, to widen it: loosening a mind that has been clenched;
    deliberately making room for others'' faults; both senses sit in the compound.'
  zh: 一面是把绷紧的心放开，一面是故意给人留余地、容得下别人的错处。两层意思都在这个字里。
- term: 清吉
  pinyin: qīng-jí
  en: 'clear and auspicious: the gate and hall literally swept and bright; the household''s
    affairs in order; one word carries sight and fortune together.'
  zh: 一面是门庭真的扫得干净明亮，一面指家里的事有条理；一个字里同时带着「看得清」和「有福」。
- term: 無傷
  pinyin: wú-shāng
  en: 'without injury, unharmed: nothing in your affairs is damaged; no harm done
    to you by others; the compound reads as reassurance rather than as a lucky sign.'
  zh: 一面说事情没有损坏，一面说没人来伤你。这个词读起来是安抚，不是吉兆。
plain_meaning:
  en: 'An open season for what is already yours: the family gathers in, standing and
    a union are called greatly auspicious, and wealth that comes lightly at first
    settles into profit. Two reservations remain - children are not granted simply
    by asking, and the winter half of the year thins out. The poem''s counsel is to
    stop straining and let the season carry the matter.'
  zh: 这一签是开的：把手放宽、自在地过，门庭清吉，家里没有要担的心；财宝先轻后得，慢慢自己转顺，事情没有伤着的地方，也不必再求什么。判词几乎一路开出好面——作事成功、家人团圆、家运兴旺、婚姻大吉；只留两处收着：子嗣不是靠求就能得，一年里带冬的那一半月令会淡一些，逢春才如意。
