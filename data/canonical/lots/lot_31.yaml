verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 綠柳蒼蒼正當時，
    en: Green willows, thick and deep - this is their very hour;
  - line_number: 2
    zh: 任君此去作乾坤，
    en: as you please, go from here and make your world;
  - line_number: 3
    zh: 花果結實無殘謝，
    en: blossom and fruit set firm, with nothing withered or fallen;
  - line_number: 4
    zh: 福祿自有慶家門。
    en: blessing and provision come of themselves to gladden the household.
keywords:
  favourable:
