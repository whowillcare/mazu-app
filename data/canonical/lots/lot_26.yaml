reading_notes:
- term: 第一枝
  pinyin: dì-yī-zhī
  en: '"the first branch": at once *the earliest bloom* and *the first choice among
    several*; The poem does not say what to leave, only not to wait.'
  zh: 既指最先开的那一朵，也指几个当中的首选。此诗没说该舍弃什么，只说不要等。
- term: 莫遲疑
  pinyin: mò-chí-yí
  en: '"do not hang back": an instruction about *timing*; not about appetite.'
  zh: 讲的是时机，不是讲胃口。
- term: 相知
  pinyin: xiāng-zhī
  en: '"true acquaintance": the one who knows and is known by you — a friend, a partner
    or a patron; The poem leaves the relation open.'
  zh: 是知你也被你知的那一个——朋友、伴侣或提携者。此诗不把这层关系定死。
plain_meaning:
  en: 'The blossom is out and the poem''s whole counsel is timing: take the first
    branch, do not wait, and let the fit between you and the right person happen while
    the season is open. Read this lot against winter — it is generous now and spare
    later.'
  zh: 花正开着，此诗通篇讲的都是时机：取第一枝，不要等，趁这一季还开着，让你和那个对的人之间的契合发生。这一签要对着冬天读——现在舍得给，往后就吝啬了。
