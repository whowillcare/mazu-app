reading_notes:
- term: 枯木
  pinyin: kū-mù
  en: 'the withered tree: a thing that looks dead but still holds its life; the questioner''s
    own situation before its season comes.'
  zh: 既是看着枯死、其实还留着生机的一棵树，也指问事人自身时令未到的处境。
- term: 寬心且守
  pinyin: kuān-xīn-qiě-shǒu
  en: 'ease your heart and hold still: waiting a season out with a settled mind; holding
    on to what you already have rather than letting it go; 守 carries both.'
  zh: 一句里是两件事：放宽心把这一季等过去；「守」还含守住手上已有的意思，两层都在。
- term: 作乾坤
  pinyin: zuò-qián-kūn
  en: 'to make a world: to build something of your own; to take charge of affairs;
    the phrase is grander than either English option.'
  zh: 字面是经营天地，实指闯出自己的一片、或把局面担起来；比哪一种现成译法都更阔大。
plain_meaning:
  en: 'A season of keeping rather than beginning: the tree has not met its spring,
    and the matter you are asking about is still hidden in the dark. Ease your mind,
    hold what you already have, and let the frost pass; when the season turns, the
    same world comes back to you to build in.'
  zh: 守成的一季，不是开新的一季：枯木还没碰上春天，你问的这件事眼下仍藏在暗处。放宽心，守住手上已经有的，让风霜先退；等节令一转，同一片天地还回到你手里去做。
