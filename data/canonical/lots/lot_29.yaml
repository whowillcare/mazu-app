verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 枯木可惜未逢春，
    en: The withered tree has not yet met the spring - what a pity;
  - line_number: 2
    zh: 如今還在暗中藏，
    en: for now it is still hidden away in the dark.
  - line_number: 3
    zh: 寬心且守風霜退，
    en: Ease your heart and hold still until the wind and frost withdraw;
  - line_number: 4
    zh: 還君依舊作乾坤。
    en: then the same world is handed back to you to make.
