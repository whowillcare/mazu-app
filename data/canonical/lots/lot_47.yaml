      未久／官事 先凶後吉。半月完局／六畜 平安／耕作 中中／築室 有合不畏／墳墓 地勢套當／討海 春夏大吉／作塭 得利／魚苗 先凶後吉／月令 不遂／尋人 慢回／遠信
      近日就至（jie_yue_score +15）。整签是先难后成：好话几乎都挂在「过了第一回」上，月令与求财两项则明说要等。校勘：异体字（于／於）按字形归一，不改字。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词是一签开头硬的：办事、出外、官事都写第一回难、第二回才顺，月令与求财两处也明说要等；好的一面挂在婚事、移居与暖季的水上。读法是把开头和结果分开看。校勘上有一个异体字，按字形归一、不改字。
