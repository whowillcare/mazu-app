reading_notes:
- term: 聖跡
  pinyin: shèng-jì
  en: 'holy signs or traces: evidence of a deity''s power, sought by divination; any
    sign one keeps looking for outside oneself.'
  zh: 既指靠占问去求的神明显迹，也指人在自己之外一再找的那个征兆；两层都算。
- term: 心中
  pinyin: xīn-zhōng
  en: 'within the heart: your own judgment; your sincerity or settled intent.'
  zh: 既指你自己的判断，也指你的诚心、你已经定下的意思。
- term: 月中旬
  pinyin: yuè-zhōng-xún
  en: 'the middle ten days of the month: a window inside the month, not a fixed date;
    the turning of the season''s cycle.'
  zh: 是月里的一段窗口，不是一个定死的日子；也可以读作时令这一圈的转折处。
plain_meaning:
  en: 'A season that turns: it opens hard, and the judgements say the first attempt
    must be tried twice and the month does not run smoothly, but the poem points to
    mid-month for trouble to work free and come out good. The counsel is to trust
    your own judgment over repeated divination, and to wait for the turn rather than
    force the first try.'
  zh: 这是一段会转的时节：开头是硬的，判词说第一回要试两遍、这个月也走不顺；但诗把话放在月中——那时候麻烦会自己松开，转成好。诗的意思是，与其反复去问，不如信自己心里那点判断，等这个转弯，别硬推第一回。
