reading_notes:
- term: 月出光輝
  pinyin: yuè-chū guāng-huī
  en: 'the moon rising and its light: plain night-sky weather, a clear hour to act
    in; the moon as the sign of the household and of quiet influence; the poem''s
    later lines tie the timing to it.'
  zh: 一面是写天象：夜里月亮出来、一片明白，是能动手的一段时辰；一面是拿月亮当家门与柔性影响的记号——后面几句的时机都系在这月光上，诗里没说动手扫云的是谁。
- term: 祿位
  pinyin: lù-wèi
  en: 'rank and stipend, office: a salaried post or appointment; standing among others
    more broadly; the line reads as peace on the road ahead, not as a promise of promotion.'
  zh: 一面指一份有俸禄的职位或任命，一面泛指在人前的名分与地位；此句说的是前路得安，不是升迁的许诺。
- term: 浮雲掃退
  pinyin: fú-yún sǎo-tuì
  en: 'the drifting clouds swept back: weather imagery: the sky before the moon is
    cleared; obstacles, talk or slander swept out of the way; the poem does not say
    who sweeps them.'
  zh: 一面是天象，遮月的云散开；一面指障蔽、口舌与流言被清掉。两层都留着，诗里不点破。
plain_meaning:
  en: 'This is a season that clears: what was clouded lifts, standing steadies, and
    the household advances. Where it thins is in money - the judgements give little
    gain in wealth and no advantage in trade, and call the month''s work slow. The
    counsel is to keep the peace and look to the home rather than to a quick profit.'
  zh: 这一签是平中带亮的一签，两面同时存在：月亮出来、遮着的浮云被扫开，名位与家宅这一路走得顺——家里进益圆满，名声与位子见稳，婚姻也谈得拢。反过来看，钱财与买卖这一面是收着的：求财只给一点，经商这一途看不出好处，月令也拖得慢。签诗的意思不是趁亮去追利，而是把和气与门庭守住。
question_gate:
  scope: one_matter
  rewritten_from:
    en: ''
    zh: ''
  rewritten_to:
