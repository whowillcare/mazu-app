criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（廟本解曰原文，照抄）：凡事 緊和平。了錢工。／作事 月光即成。／家事 大進圓滿。／家運 平安／婚姻 和合。／求兒
      好。／六甲 先男。／求財 少有。／功名 顯榮祖宗。恐有變。／歲君 中和／治病 陰邪祟。求神安。／出外 先少利。後可得。／經商 無利。／來人 月光到。／行舟
      財輕。平平。／月令 不遂。／討海 無大財。陰作祟。／耕作 平正。／築室 漸且候。待日期。——总评：整签为平（jie_yue_score +16），家事、家運、婚姻、求兒一路开，求財、經商、月令一路收；两面并存，是典型的平中带亮。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在家宅、名位、婚姻、子嗣几处都开出好面，落点集中在门户与人伦上；同一个签在钱财、买卖与月令三处则偏于收束。两面对读，是平中带亮的一签。
