    evidence: the judgements run positive throughout - 凡事 大吉。有貴人／家運 禎祥福祉／求財 積善大利／行舟
      大吉利／討海 可得大進／作塭 滿載而歸／月令 平安 (jie_yue_score +22, the highest of this stem-group)
