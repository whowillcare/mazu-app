reading_notes:
- term: 積善
  pinyin: jī-shàn
  en: 'piling up good: good deeds accumulated across a family''s history; the classical
    tag 積善之家必有餘慶 (the house that piles up good has blessings left over): the blessing
    is inherited, not purchased.'
  zh: 是一家人一代代攒下来的善；用典是「積善之家必有餘慶」——这份福泽是承下来的，不是买来的。
- term: 指日
  pinyin: zhǐ-rì
  en: 'pointing at the day: shortly, within a few days; the day can already be pointed
    to, i.e. the outcome sits in the near season - a manner of speech, not a date.'
  zh: 是日子已经能指着数了：一是指就在这几日内，二是指结果落在近处的一个时节——是一种说法，不是日期。
- term: 門閭
  pinyin: mén-lǘ
  en: 'the gate and the lane: the household''s own gate; the lane and the neighbourhood,
    which share in its honour.'
  zh: 既指自家门口，也指门外的里巷——这份荣耀是这一带一起沾的。
plain_meaning:
  en: 'An open, well-supplied season: the poem answers a question asked from the heart
    with a house that has blessings left over, and puts wealth and children at the
    gate. The judgements agree and add helpers - the run is smooth, the roads out
    are good, and the work of the sea comes home full. The counsel is to keep up the
    good this rests on, and to spend the season rather than test it.'
  zh: 这是一个开阔、有余的时节：诗里对一句从心里问出的话，答的是积善之家福气有剩，把财与子放在门口。判词与它一路相合，还添了贵人——运势顺、出门的路好、海上的活儿满载而归。劝的是把这份好所依托的善继续做下去，这一季拿去用，而不是拿去试。
