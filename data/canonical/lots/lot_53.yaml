criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 大吉。有貴人／作事 成好／家事 進益無窮／家運 禎祥福祉／婚姻 成好。益夫旺子／求兒 先女後男／六甲
      雙生貴子／求財 積善大利／功名 可得進／歲君 中平／治病 拖尾不畏。平安／出外 好。利路亨通／經商 萬利可得／來人 月光到／行舟 大吉利／移居 平安／失物
      援尋／求雨 月尾到／官事 緊審和好。完者大吉／六畜 可納平安／耕作 中平／築室 可好。瑞氣呈祥／墳墓 大吉。世代流芳／討海 可得大進／作塭 滿載而歸／魚苗
      有大利／月令 平安／尋人 得回／遠信 速報佳音——整签偏正，本组最高分；惟 求財 積善大利 把好处系在已积之善上、治病 拖尾不畏。平安 仍留一个缠绵，歲君
      中平 与 耕作 中平 两项平平（jie_yue_score +22）。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上几乎处处偏正面——总类、作事、家事、家运、婚姻、功名、经商、行舟、移居、筑室、坟墓、讨海、作塭、鱼苗、月令、寻人、远信都在这边，并以家宅的进益为主线；唯总类之外，岁君与耕作两项平平，治病一项留有缠绵。故列为本批的偏正一档，是这一组的最高分。
