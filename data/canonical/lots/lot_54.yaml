keywords:
  favourable:
    en:
    - a lamp kept burning
    - a household that thrives quietly
    - good done where no one sees
    - small returns taken as they come
    zh:
    - 续着不灭的一盏灯
    - 静静兴旺的一家人
    - 没人看见处做的好事
    - 有小利就收
  guarded:
    en:
    - forcing an undertaking that does not come together
    - taking a partner into the venture
    - counting on the lamp to light the whole night
    - expecting the quiet season to pay richly
    zh:
    - 硬推一件聚不起来的事
    - 拉人入伙做生意
    - 指望这盏灯点整夜
    - 以为安静的时节会大笔进账
reading_notes:
- term: 陰中
  pinyin: yīn-zhōng
  en: 'within the hidden side: good done where no one sees it; the dark half of things,
    the unseen side of a life; the line reads as a condition on the blessing and is
    left open.'
  zh: 既指没人看见处做的善，也指事情暗的那一半、人生的背面；这一句是给福气加的条件，语气留有余地。
- term: 善果
  pinyin: shàn-guǒ
  en: 'good fruit: the fruit of good deeds, in the old Buddhist sense of a ripening
    karma; fruit that ripens out of sight; the phrase holds both the moral and the
    horticultural sense.'
  zh: 是善行的果实，带一点旧时佛家「果报渐熟」的意思；也照字面指在暗处结出的果。两层都留着。
- term: 達神明
  pinyin: dá-shén-míng
  en: 'to reach the divine: the incense carries the petition up to the gods - in a
    Mazu temple, to Mazu herself; to be understood by what is divine in the matter,
    i.e. the intent is received; the ritual sense is kept.'
  zh: 是香烟把所求送上神前——在妈祖庙里，就是送到妈祖跟前；也指这份心意被事情里那一点神明听懂了。香火这一层意味保留着。
plain_meaning:
  en: 'A quiet season lit by one lamp: the poem gives a still night, then all things
    clear and accomplished - on the condition that good has been kept in hidden places.
    The judgements favour the household, the marriage and the shrine, while the working
    life stays ordinary and the profits small. The counsel is to keep the lamp lit,
    take no partner into the venture, and let what was done in secret come forward.'
  zh: 这是一段只点一盏灯的安静时节：诗先给一夜深沉，然后说万事清吉、万事得成——前提是暗处存着善。判词偏袒家宅、婚姻与庙门，而活计仍是一般，进项也小。劝的是把这盏灯续着，生意不要拉人合伙，让暗中所做的自己浮出来。
question_gate:
  scope: one_matter
  rewritten_from:
