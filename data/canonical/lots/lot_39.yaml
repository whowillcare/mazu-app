register:
  level: mixed
  source: curated
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements promise help and a good ending, but only after a lean
      opening - 作事 有貴人。好到尾／家運 漸漸平安／經商 先平後利／討海 先不利後小利 against 月令 不遂了財／求兒 不可。有事／六畜 不可;
      gain is first withheld and then granted small (jie_yue_score +13, but the profile
      is double-natured rather than bright)
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: 'The temple book on this lot runs in two halves - it promises help and
      a good ending, but always after a lean opening: undertakings, family fortune,
      trade, income, advancement, and building are all described as gradual, and boats,
      sea work, ponds, and fry all run loss-first and gain-after; children, livestock,
      the month''s season, visitors, finding people, and rain run against. Taken together
      it reads as adverse first and modestly better after, We read it as mixed.'
criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 漸應。／作事 有貴人。好到尾。／家事 永獲吉慶。／家運 漸漸平安。／婚姻 成好。二次者成好。／求兒
      不可。有事。／六甲 子媳晚。得弄璋。／求財 漸有。／功名 望後科。／歲君 淡安。／治病 少貴人。老拖運。／出外 遇貴人／經商 先平後利。／來人 難在。／行舟
      先不利。後小利。／失物 尋在。／求雨 未有。／官事 後有貴人。／六畜 不可。／耕作 照舊種。可收成。／築室 後好。／墳墓 地勢允好。／討海 先不利後小利。／作塭
      先失利後有利。／魚苗 失在前利在後。／月令 不遂了財。／尋人 難在。／遠信 緩緩就至。——整签两截（jie_yue_score +13）：通篇许的是助力与好结局，却一律排在清薄的开头之后——作事、家運、經商、求財、功名、築室
      都作渐进，行舟、討海、作塭、魚苗 一路都是先失后得；而 求兒 不可、六畜 不可、月令 不遂了財、來人 難在、尋人 難在、求雨 未有 几处偏阻。先不利而后小利，故列为本批的「平」一档。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上是两截的——它许了助力与好结局，但一律排在开头那一段清薄之后：作事、家运、经商、求财、功名、筑室都作渐进之象，行舟、讨海、作塭、鱼苗一路都是先折后得；而求儿、六畜、月令、来人、寻人、求雨几处偏阻。合起来是开头一段不顺、之后转为小利，故列为本批的「平」一档。
