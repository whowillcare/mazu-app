    / temple01(好廟網): 名顯有意在中央、不須祈禱心自安。」, six-source vote: 中央 carries the wider attestation,
    and the sense and rhyme are unchanged; 「feishuai, mznn: ...不须祈祷心自安；看看早晚日过后，」→「91chouqian,
    temple01(好廟網): ...不須祈禱心自安、看看早晚日過後、」, punctuation only - the wording itself is
    identical across all six votes'
  reviewed_on: '2026-10-06'
