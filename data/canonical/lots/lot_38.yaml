    en: The judgement reads well for unions, and the good outcome sits in the middle
      of the poem; time, not pressure, brings it.
    zh: 判词对结缘读得好，而好的结果落在诗的正中间；把它带出来的是时间，不是催逼。
    compliance_tag: null
  career:
    en: The name is honoured, but after a wait - early pushes bring little, later
      ones bring much.
    zh: 名头是受看重的，但要等一等——早使劲收效少，后使劲收效多。
    compliance_tag: null
  money:
    en: Gain is late and large in the judgement; the discipline this lot asks for
      is patient holding. (Not financial advice.)
    zh: 判词里进项来得晚、量也大；这一签要练的就是有耐心地守。（非财务建议。）
    compliance_tag: not_financial_advice
  health:
    en: Recovery reads as calm and complete; steady care, not a hurried cure. (Not
      medical advice.)
    zh: 复原读成平稳而周全；要的是安稳的调养，不是求一个快。（非医疗建议。）
    compliance_tag: not_medical_advice
  family_home:
    en: A house that gains standing; keep to your own ground and the household brightens.
    zh: 是能挣得门面的家；守好自己的地面，家里就亮起来。
    compliance_tag: null
  travel_moving:
    en: Going out reads as profitable; even so, the poem's counsel is to let the hour
      come first.
    zh: 出门读成有利可图；即便如此，诗里劝的还是让时辰先到。
    compliance_tag: null
  sea_and_voyage:
    en: Plain, ordinary gain for boat and shore - nothing dramatic, nothing lost.
    zh: 行舟与讨海是平实的进项——不出彩，也没有折损。
    compliance_tag: null
  livelihood_and_seasons:
    en: Field and stock yield as usual; a slow season that pays.
    zh: 田作与六畜照常出产；这是慢，但是有回报的一季。
    compliance_tag: null
  timing:
    en: Late rather than now - a season, never a date.
    zh: 是往后的事，不是现在——要等日子过去；诗里没有给日期。
    compliance_tag: null
  what_to_avoid:
    en: Pressing for an early result; reading a slow season as a closed one.
    zh: 急着要一个早的结果；把慢的一季读成关门的一季。
    compliance_tag: null
  reassurance:
