register:
  level: favourable
  source: curated
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements read well but keep putting the good after a wait -
      凡事 守己安分／作事 晚成好。早無利／求財 晚來好／經商 後有大財／功名 真可喜／出外 必得利; the dull notes are 求雨 尚未 and
      月令 平平, and 官事 了錢 (jie_yue_score +23)
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: The temple book reads well across the board on this lot, but it puts
      every good thing after a wait - general affairs, household, family fortune,
      marriage, children, income, advancement, the year's ruler, going out, trade,
      moving house, livestock, field work, building, graves, sea work, ponds, fry,
      finding people, and distant news all sit on the bright side; the undertaking
      line says plainly that the late result is the good one and the early one brings
      little, rain and the month's season are flat, and the legal line settles only
      at a cost. We read it as favourable.
criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 守己安分。／作事 晚成好。早無利。／家事 門庭光輝進益。／家運 恭順。／婚姻 成好。／求兒
      好。／六甲 生男。／求財 晚來好。／功名 真可喜。／歲君 順利。／治病 平安痊癒。／出外 必得利。／經商 後有大財。／來人 三日後到。／行舟 平平得利。／移居
      可有喜慶。／失物 尋必在。／求雨 尚未。／官事 祈神完明。了錢。／六畜 有利可得。／耕作 有收可以。／築室 得意平安。／墳墓 地勢可佳。速發。／討海 下半年有利。／作塭
      可喜有利。／魚苗 五日內買得利。／月令 平平。／尋人 漸回。／遠信 急至。——整签偏正（jie_yue_score +23）：通篇判词都好，却反复把好处排在「等一等」之后；惟
      求雨 尚未、月令 平平 两处平淡，官事 一项事情了结仍要花钱。校订：首句依六源多数决取「名顯有意在中央」（别本作「中間」），标点从维基文库，字句诸本全同。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上整体读得好，却把好处一律放在等候之后——总类、家事、家运、婚姻、子嗣、求财、功名、岁君、出外、经商、移居、六畜、耕作、筑室、坟墓、讨海、作塭、鱼苗、寻人、远信都偏正面；作事一项明说晚成、早动收效少，求雨与月令两处平淡，官事一项则是事情了结仍要花钱。故列为本批的偏正一档。
