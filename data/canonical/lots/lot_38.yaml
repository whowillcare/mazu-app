reading_notes:
- term: 中央
  pinyin: zhōng-yāng
  en: 'the centre, the middle: the middle position among others; the central place
    in the matter; the poem repeats the word, so both senses stay live.'
  zh: 既指众人当中的中间那个位子，也指这桩事的中心所在；诗里两头都用到这个词，两层意思都留着。异文说明：首句诸本有一处作「名顯有意在中間」，本件依六源多数决取「中央」——「中央」在诸本中出现更广，句意与押韵都没有改变；另有两本只是顿逗标点之别，字句全同，此处标点从维基文库。
- term: 不須祈禱
  pinyin: bù-xū-qí-dǎo
  en: 'no need to pray for it: the matter does not depend on petitions; the petition
    is not what moves it; the poem does not say which is meant.'
  zh: 是说这桩事不靠祈求来推动：既指不必去求，也指求并不是让它成的那股力；这一句没有说定是哪一层。
- term: 早晚日過後
  pinyin: zǎo-wǎn-rì-guò-hòu
  en: 'after the days have passed, sooner or later: after a short time; after a longer
    time; the phrase deliberately covers both.'
  zh: 把早晚都包了进去：既指再过不长的日子，也指再过一段较长的日子；这个说法有意两段都算。
plain_meaning:
  en: 'A season that ripens late: the name is honoured, but the outcome arrives after
    time has passed rather than at once. Early moves bring little, later moves bring
    much, and the poem says the matter does not need to be prayed or pushed. The counsel
    is to keep to your own ground and let the hour come to you.'
  zh: 晚熟的一季：名头是受看重的那一回事，但结果要等日子过去才到，不是马上就来。早动的手收效少，后动的手收效多；诗里说这桩事不必去求，也不必去推。劝的是守着自己的地面，让时辰自己走到你面前。
