register:
  level: unfavourable
  source: curated
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements run negative across the lot - 凡事 小心為要／作事 難成／婚姻 不可／求兒
      不吉。無根基／求財 空無／功名 難望／經商 多勞辛苦／官事 拖尾。了錢／月令 不遂／作塭 失利無望／魚苗 無利了錢, with only 家事 門庭小吉
      and 六甲 先女後男。無求必得 holding the other way (jie_yue_score -5)
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: On this lot the temple book runs against the matter almost everywhere
      — general affairs, undertakings, family fortune, marriage, children, income,
      advancement, going out, trade, boats, moving house, livestock, building, graves,
      sea work, ponds, fry, and the month's season; only the household line (a small
      blessing on the door) and the child line (a daughter first, then a son) are
      left open, and the legal line carries both delay and loss. We read it as unfavourable.
