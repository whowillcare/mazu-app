    zh: 病中若得苦心勞，
    en: If illness lays a bitter toil on the heart;
  - line_number: 2
    zh: 到底完全總未遭，
    en: and in the end nothing is brought through whole;
  - line_number: 3
    zh: 去後不須回頭問，
    en: once gone, there is no need to turn back and ask;
  - line_number: 4
    zh: 心中事務盡消磨。
    en: the matters in the heart are all worn away.
