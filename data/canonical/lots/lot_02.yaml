register:
  level: mixed
  source: curated
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements open positive but keep a cold half — 凡事 春天到／婚姻 永偕伉儷／經商
      大吉利市／築室 大吉, with 求財 如泉湧。先有後無／作事 春成美。冬不佳／出外 春夏好。秋冬呆／移居 平平。不可／討海 春有冬無 (jie_yue_score
      11)
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: The temple book runs mostly favourable on this lot — general affairs,
      undertakings, household, family fortune, marriage, children, income, advancement,
      trade, travel, boats, livestock, field work, building, graves, sea work, ponds,
      fry, finding people and distant news all sit on the positive side; only the
      income line turns thin after a first surge, and moving house and autumn-winter
      travel are left open. Support comes with a reversal inside it, so we read this
      lot as mixed.
criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 春天到。／作事 春成美。冬不佳。／家事 必得進益。／家運 福祉茂盛。／婚姻 永偕伉儷。／求兒
      適宜。／六甲 生男。／求財 如泉湧。先有後無。／功名 二次成。秋進連中。／歲君 中和。／治病 老不好。少平安。／出外 春夏好。秋冬呆。／經商 大吉利市。／來人
      南方。／行舟 有大財。／移居 平平。不可。／失物 謹尋在。遲者無。／求雨 甲子日得有。／官事 完局。／六畜 興旺大利。／耕作 春季如意。／築室 大吉。／墳墓
      光前裕後。／討海 春有冬無。／作塭 可慶獲利。／魚苗 大利。／月令 不畏。／尋人 南方。／遠信 春天到。——整签偏正，开头旺、入冬转淡；唯 求財 先有後無、移居
      平平。不可、出外 秋冬呆 三处留有余地（jie_yue_score 11）。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上大体偏正面——总类、作事、家事、家运、婚姻、求儿、子嗣、求财、功名、经商、出行、行舟、六畜、耕作、筑室、坟墓、讨海、作塭、鱼苗、寻人、远信都在正面一侧；只有求财一项先旺后淡，搬居与秋冬出行两项留有余地。支持中带着一次反转，故读作
      mixed。
