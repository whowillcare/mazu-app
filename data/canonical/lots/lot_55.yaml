    zh: 真正属于你的没有丢——只是还没被看见。
    compliance_tag: null
stories:
- title:
    zh: 郭華醉酒誤佳期
    en: The Pearl Deeply Hidden
  is_primary: true
  is_variant: false
  cross_reference_lot: null
  narrative:
    zh: 宋朝有个读书人叫郭华，到都城汴京赶考。汴京是北宋的京城，在今河南开封。他在城里看上一家胭脂铺的女子王月英，落榜以后不肯回家，就留在京城。两人约好夜里相见。到了约定的那晚，王月英来了，郭华却因为喝多了酒，醉倒在床上，怎么推也不醒。王月英没有办法，脱下自己一只鞋，藏在他怀里，然后回去了。郭华醒来，看见怀里的鞋，又悔又恨，竟仰头吞下那只鞋，就此死去。后来的人讲这件事，多把它当作出门误事、因酒失约的戒例。
    en: In the Song dynasty a scholar named Guo Hua went to the capital, Bianjing,
      to sit the examination. Bianjing, in present-day Kaifeng in Henan, was the capital
      of the Northern Song. In the city he fell for a woman of a rouge shop named
      Wang Yueying. After he failed the examination he refused to go home and stayed
      on in the capital. The two agreed to meet at night. On the agreed night Wang
      Yueying came, but Guo Hua had drunk too much. He lay dead drunk on the bed,
      and no shaking could wake him. Wang Yueying had no way to rouse him. She took
      off one of her shoes, hid it in his bosom, and went back. When Guo Hua woke
      and saw the shoe in his bosom, he was full of regret and hate. He threw back
      his head and swallowed the shoe, and so he died. Later people told this story
      as a warning. It is a case of a man ruining his business away from home, and
      of a promise broken through drink.
  poem_connection:
    zh: 签诗“须知进退总虚言”“心中但得枉徒然”，正合郭华错过佳期、空留悔恨一事。
    en: The poem says one must know how to advance and retreat, and that keeping a
      thing in the heart comes to nothing, which fits Guo Hua missing his night with
      Yueying and keeping only regret.
- title:
    zh: 朱買臣負薪
    en: Zhu Maichen Shoulders Firewood
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 朱买臣是西汉时吴地人，家里很穷，靠砍柴卖钱过活。他好学，挑着柴走在路上时，把书挂在担头上，一边走一边读。他的妻子背着柴跟在旁边，几次劝他别在路上念出声，他不听，照旧诵读。妻子觉得丢脸，要求离开他。朱买臣劝她说，自己到了五十岁上会富贵，现在已四十多岁，将来一定报答她。她不肯等，改嫁走了。后来朱买臣跟着地方官属到了长安，上书求见，得到汉武帝接见，做了官，又出任会稽太守。到任时，他看见前妻和她的丈夫在修路，就让后面的车子载他们到官舍供养。过了一个月，前妻自缢而死。
    en: Zhu Maichen was a man of the Wu region in the Western Han. His family was
      very poor, and he lived by cutting firewood and selling it. He loved learning.
      As he walked the road with firewood on his shoulder, he hung his books on the
      carrying pole and read as he went. His wife carried firewood on her back and
      followed beside him. Several times she asked him not to read aloud on the road.
      He did not listen and read on as before. His wife felt shamed and asked to leave
      him. Zhu Maichen urged her to stay. He said he would rise to wealth and rank
      at fifty, that he was already past forty, and that he would repay her in the
      end. She did not wait and married another man. Later Zhu Maichen went with local
      officials to Chang'an. He sent up a petition and was received by Emperor Wu
      of Han. He was given office, and later became governor of Kuaiji. When he took
      up the post, he saw his former wife and her husband repairing the road. He had
      the carriage behind him carry them to his residence and support them there.
      A month later she hanged herself.
  poem_connection:
    zh: 签诗说进退的话都难作准，眼前昏暗未必就是全无希望。朱买臣长年贫苦，后来才显达，正合此意。
    en: The lot poem says words of going forward or back are both hard to trust, and
      that dim light now does not mean all hope is gone. Zhu Maichen was poor for
      years before he rose.
- title:
    zh: 蘇妲己亂商
    en: Su Daji Ruins the Shang
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 商朝的末代君主纣王去女娲宫里进香，在墙上题了一首诗，言语冒犯了神明。女娲便派一只修行的千年狐狸精，连同另外两个妖怪，下到宫中，去迷惑纣王的心。狐狸精借冀州侯苏护的女儿妲己的身体进了宫，深得纣王宠爱。她进谗言，除掉了姜皇后，逼死了忠臣比干，又设下炮烙、虿盆这样的酷刑。纣王从此天天饮酒作乐，不理朝政，商朝一天天败坏下去。后来周武王起兵讨伐，纣王的军队大败，他在鹿台自焚，商朝灭亡。那只狐狸精事败之后，被斩在辕门之下。
    en: King Zhou, the last ruler of the Shang dynasty, went to offer incense at the
      palace of Nuwa and wrote a poem on the wall that offended the goddess. Nuwa
      therefore sent down a fox spirit that had cultivated itself for a thousand years,
      along with two other demons, into the palace to bewitch the king's heart. The
      fox spirit entered the palace in the body of Daji, daughter of Su Hu, the Marquis
      of Jizhou, and won the deep favor of King Zhou. She slandered and did away with
      Empress Jiang, hounded the loyal minister Bi Gan to his death, and devised cruel
      punishments such as the burning pillar and the pit of snakes. From then on King
      Zhou drank and made merry every day and paid no heed to state affairs, and the
      Shang declined day by day. Later King Wu of Zhou raised an army and attacked.
      King Zhou's troops were beaten, he burned himself on the Deer Terrace, and the
      Shang dynasty ended. When the fox spirit's plot failed, she was beheaded outside
      the army gate.
  poem_connection:
    zh: 这一签说进退失据、珠玉深藏未变，正配纣王听信妲己之言、朝政败坏这一段。
    en: This lot says advance and retreat both fail, and the pearl stays hidden and
      unchanged. It fits King Zhou listening to Daji and the government falling into
      ruin.
- title:
    zh: 郭曖尚公主
    en: Guo Ai Marries the Princess
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 郭暧是唐朝名将郭子仪的儿子，娶了唐代宗的女儿升平公主。尚公主，就是娶皇帝的女儿为妻。这样的亲事，是皇家的恩典。郭子仪做寿，儿子媳妇都来拜寿，只有升平公主仗着自己是皇帝的女儿没有去。郭暧因此被兄弟们取笑，回房和公主争执起来，话里带上了自己的父亲。公主进宫陈诉，代宗没有加罪，只是劝他们夫妻和睦。郭子仪听说了，亲自把郭暧绑起来带到朝上请罪。代宗没有追究，只说做长辈的不妨装些糊涂，还赏了东西安慰他，风波这才平息。
    en: Guo Ai was a son of Guo Ziyi, the famous general of the Tang. He married Princess
      Shengping, daughter of Emperor Daizong of Tang. To marry a princess means to
      take the emperor's daughter as a wife. Such a match was a favour from the imperial
      house. On Guo Ziyi's birthday his sons and their wives came to offer their good
      wishes. Only Princess Shengping did not come, relying on being the emperor's
      daughter. For this his brothers mocked Guo Ai. He went back to his room and
      quarrelled with the princess, and in his words he slighted his own father. The
      princess went into the palace and told the emperor. Daizong did not punish anyone;
      he only urged the couple to live in peace. When Guo Ziyi heard, he tied Guo
      Ai up himself and brought him to court to ask for punishment. Daizong did not
      pursue it. He said only that elders do well to act a little blind. He gave gifts
      to comfort him, and the storm passed.
  poem_connection:
    zh: 这一签的签诗说进退都是空话，看着暗淡的事未必不成全，珠玉深藏还没有变。郭暧夫妻这场争执，正是进退失当而起、各让一步而息。
    en: The poem says advance and retreat are both empty talk, and a dim-looking thing
      need not fail. Guo Ai and his wife fell out through a misstep and ended when
      each gave way.
- title:
    zh: 玉堂春求佛嫁良緣
    en: Yutangchun Prays to Buddha for a Good Marriage
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 明朝正德年间，有个名妓叫玉堂春，本名苏三。妓院里的女子靠卖艺卖笑为生。她和吏部尚书的儿子王景隆相好。吏部是朝廷管官员任免的部门，尚书是它的长官。王景隆人称三官。三官在妓院里把银钱花光，被老鸨赶了出来。老鸨就是妓院的老板娘。玉堂春送他银两，让他回乡读书，求取功名。三官走后，玉堂春在院中对着神明烧香许愿，愿三官早日考中，好来与她结成良缘。三官果然高中。可这时玉堂春已被老鸨卖给山西商人沈洪做妾。沈洪又被自己的妻子毒死，妻子反过来诬告玉堂春谋杀亲夫。知县收了贿赂，把她屈打成招。正巧王三官出任山西巡按，重审这件案子，冤情才得昭雪，两人终于团圆。巡按是朝廷派到地方查案的监察官。这一签说须知进退总虚言，又说珠玉深藏还未变，正配玉堂春身陷冤狱、终得昭雪团圆的一段。
    en: In the Zhengde years of the Ming there was a famous courtesan called Yutangchun,
      whose real name was Su San. Women in a brothel lived by selling their arts and
      their smiles. She was close to Wang Jinglong, the son of a Minister of Personnel.
      The Ministry of Personnel was the office that managed the appointment and dismissal
      of officials, and the minister headed it. Wang Jinglong was known as Sanguan.
      Sanguan spent all his silver in the brothel and was thrown out by the madam.
      The madam was the woman who ran the brothel. Yutangchun gave him silver and
      told him to go home, study, and seek office. After Sanguan left, Yutangchun
      burned incense before the gods in the house and made a vow that Sanguan would
      pass the examination soon and come to marry her. Sanguan did pass with high
      marks. But by then Yutangchun had been sold by the madam to a Shanxi merchant,
      Shen Hong, as a concubine. Shen Hong was then poisoned by his own wife, and
      the wife turned around and accused Yutangchun of murdering her husband. The
      county magistrate took a bribe and tortured her into a confession. It happened
      that Wang Sanguan was appointed regional inspector of Shanxi. He retried the
      case and the wrong was righted, and the two were at last reunited. A regional
      inspector was a supervising official sent by the court to a region to check
      on cases.
  poem_connection:
    zh: 这一签说须知进退总虚言、珠玉深藏还未变，正配玉堂春身陷冤狱、终得昭雪团圆的一段。
    en: This lot says that talk of advancing and holding back is all empty words,
      and that the pearl and jade lie deep and have not changed - Yutangchun caught
      in a false case and at last cleared and reunited.
