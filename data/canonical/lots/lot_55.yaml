    zh: 等图景清楚了再动——只给季节，不给日期。
    compliance_tag: null
  what_to_avoid:
    en: Treating talk as result; mistaking a dark patch for the whole.
    zh: 把话当结果；把一片暗当成全部。
    compliance_tag: null
  reassurance:
