reading_notes:
- term: 進退
  pinyin: jìn-tuì
  en: '"advance and retreat": at once *your moves up and down* and *the two directions
    a decision can take*; the poem calls both of them, for now, talk rather than result.'
  zh: 既指你上上下下的举动，也指一个决定可以走的两个方向；诗说眼下两样都还只是话，不是结果。
- term: 珠玉深藏
  pinyin: zhū-yù-shēn-cáng
  en: '"pearl and jade lie deeply hidden": value that is *concealed from view* and
    value that is *not yet brought out*; the poem says it has not changed — only that
    it is not yet seen.'
  zh: 既指价值藏起来、不被看见，也指价值还没被拿出来；诗说它没有变——只是还没被看见。
- term: 未必全
  pinyin: wèi-bì-quán
  en: '"may not be the whole": literally *may not be complete*; the line keeps open
    the chance that what looks dark is not the entire picture.'
  zh: 字面是「未必完整」；这一句给「看着暗」留了口子：暗不是全部。
plain_meaning:
  en: 'A thin season: talk runs ahead of result and things stay out of sight, so the
    same effort yields little. Nothing is lost that was truly held — the pearl is
    intact — but this is a season for still waiting rather than forcing a return.'
  zh: 淡的一季：话跑在结果前面，事情还留在看不见的地方，同样的力气换回来的不多。真正守住的东西没有丢——珠子还完好——此时宜继续等，而不是硬把回报催出来。
