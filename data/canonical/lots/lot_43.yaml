    evidence: 'a waiting season, good after its turn: 凡事 候時過月半。貴人成／家運 光輝門庭／治病 月半過。有貴人／來人
      月光到／討海 月半過大進 - set against 功名 不就／出外 不利／移居 不可／月令 了錢／歲君 起倒／婚姻 平平 (jie_yue_score
      13)'
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: 'The temple judgements read this as a lot of waiting: household fortune,
      health, visitors, boat work, sea work, fry and distant news all place the improvement
