verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 一年作事急如飛，
    en: All year you have worked as if in headlong flight;
  - line_number: 2
    zh: 君爾寬心莫遲疑，
    en: set your heart at ease, and do not waver;
  - line_number: 3
    zh: 貴人還在千里外，
    en: the helper you need is still a thousand li away;
  - line_number: 4
    zh: 音信月中漸漸知。
    en: word of it comes to you little by little, toward mid-month.
