criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（庙本解曰原文，照抄）：凡事 候時過月半。貴人成／作事 月半好／家事 喜遇貴人／家運 光輝門庭／婚姻 平平／求兒
      平正。且候寬緩／六甲 先女後男／求財 未遇時。月半合／功名 不就。得意允進／歲君 起倒／治病 月半過。有貴人／出外 不利／經商 先無後有／行舟 小有利益／移居
      不可／失物 月光在／官事 不畏／討海 月半過大進／作塭 後有大利／魚苗 月半過有利／月令 了錢／尋人 月半過有人報／遠信 中旬可至。总评：平签，宜候时（jie_yue_score
      13）——多类目把好转落在「月半」之后，功名「不就。得意允進」（同一项自带反读）、出外「不利」、移居「不可」三处是当下的阻力；月令「了錢」提醒过渡期有花用。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词把本签读成一支候时的签：家运、治病、来客、行舟、讨海、鱼苗、远信多项都把好转放在月中之后，功名与家宅两项留有余地；同时功名、出外、移居与月令四项指向前一段的阻力。吉凶相半的平签，先守后动。
