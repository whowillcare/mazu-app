reading_notes:
- term: 太公
  pinyin: tài-gōng
  en: 'the Grand Duke: the honorific of the old angler Jiang Ziya; the type of merit
    that arrives late; English "Duke" would freeze only one sense.'
  zh: 既是那位老渔翁姜子牙的敬称，也代表一种晚到才成的功业；英文若只作「Duke」，就把其中一义钉死了。
- term: 八十成
  pinyin: bā-shí-chéng
  en: 'completed at eighty: a literal age; a figure for lateness; read it as a season
    of late ripening, not a count of years.'
  zh: 既可以是实数八十岁，也可以只是一个「晚」的说法；宜读作晚熟的季节，不是年岁的计数。
- term: 茅屋
  pinyin: máo-wū
  en: 'the thatched house: poverty; the modest base one works from; the poem does
    not say the house is exchanged, only that things go well inside it.'
  zh: 既可指清贫，也可指一个人做事所凭的那点小底子；籤文没说会换掉这间屋，只说屋里事事顺。
- term: 月光
  pinyin: yuè-guāng
  en: 'the light of the moon: a phase of the month, as the judgements use it (來人 月光到；失物
    月光在。月暗無); the spread of a good fortune over the whole sea.'
  zh: 既是解曰用来计时的一个月相（來人 月光到；失物 月光在。月暗無），也指这份好处铺满四海。
plain_meaning:
  en: 'A season that opens late: the poem''s image is the old angler who comes into
    his own at eighty, and the judgements give support, gain and settled ground -
    but after a dull first stretch with nothing to show. The counsel is to keep working
    from the small house you already have, keep your dealings upright, and let the
    help that is on its way find you.'
  zh: 一个开着的季节，只是开得晚：籤文的意象是那位到八十岁才成事的老渔翁，解曰给的是贵人、得益与安居——但得先走过一段拿不出成绩的平淡开头。建议是从你已经有的那间小屋做下去，把往来做正，让在路上的帮助自己找上来。
