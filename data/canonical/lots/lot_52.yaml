reading_notes:
- term: 意懸懸
  pinyin: yì-xuán-xuán
  en: 'the heart hung up and swinging: worry that swings back and forth; suspense
    before a result; the poem asks you to stop keeping the heart up on its hook.'
  zh: 是心挂着晃：既指来回摆动的忧，也指结果未出之前的悬着；诗是叫你别再把心挂在那只钩上。
- term: 遲與速
  pinyin: chí-yǔ-sù
  en: 'late and soon: the pace of the outcome; whether to press or to wait; the answer
    points at an open window rather than at a schedule.'
  zh: 既指结果来得早晚，也指该催还是该等；答案指向一扇已经打开的门，不是一张日程表。
- term: 風雲際會
  pinyin: fēng-yún-jì-huì
  en: 'wind and cloud meeting: the propitious meeting of a man and his chance; storm
    weather gathering: an opening that stands in front of you rather than far off.'
  zh: 既有风云相合、君臣相遇这一层，也有风暴将起这一层；说的是眼前就有开口，不必等到远处。
plain_meaning:
  en: 'A season of slow ripening with real risk in it: the poem says office and enterprise
    were Heaven''s to give, and that the wind-and-cloud meeting is already in view.
    The judgements turn up and down - the household and the patron are good, money
    floats, the year has its rises and falls. The counsel is to make the one first
    move early and then let the rest ripen.'
  zh: 这是一段慢慢熟成、却真有风险的时节：诗里说功名事业本是天给的，风云际会已经在眼前。判词两头都有——家里与贵人是好的，钱财浮沉，这一年有起有落。劝的是那一步要早动，之后就让它慢慢熟。
