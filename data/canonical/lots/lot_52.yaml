    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: the judgements cut both ways - 凡事 慢成。大險／求財 浮沉／歲君 起倒／官事 有虛。破財完局 - against
      家事 家庭大吉／家運 到處有貴人／婚姻 成好／討海 得財在三日過 (jie_yue_score +14, positive overall while
