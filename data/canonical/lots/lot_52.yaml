criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 慢成。大險／作事 急成。遲者了錢／家事 家庭大吉／家運 到處有貴人／婚姻 成好／求兒 好／六甲
      添之弄璋／求財 浮沉／功名 事業本由天，／歲君 起倒／治病 三日過貴人好／出外 行遇主公／經商 萬商雲集／來人 立即到／行舟 有利可得／移居 平正／失物
      難尋。速尋在／求雨 多風雨少／官事 有虛。破財完局／六畜 有利／耕作 平平有收／築室 可以平安／墳墓 穴場允吉／討海 得財在三日過／作塭 有大利／魚苗
      此近日得大財／月令 平平。漸漸平安／尋人 漸回／遠信 音信立至——两头都有：家事、家運、貴人、海上一路好，而 凡事 带大险、功名 一处照抄诗句未另出判词、錢財
      浮沉、歲君 起倒、官事 破財完局 则偏阻（jie_yue_score +14，列为本批的中间一档）。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上两头都有——家事、家运、婚姻、出外、经商、行舟、讨海、作塭、鱼苗、月令数处偏正面，并以路上得贵人为主线；而总类带险、钱财浮动、岁君有起落、官事结算伤财数处偏阻。综合分值贴近正负门槛，故同列为本批的中间一档。
