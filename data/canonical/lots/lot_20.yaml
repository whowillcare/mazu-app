  lines:
  - line_number: 1
    zh: 前途功名未得意，
    en: On the road ahead, rank and name are not yet won;
  - line_number: 2
    zh: 只恐命內有交加，
    en: the fear is that this allotment holds a double weight.
  - line_number: 3
