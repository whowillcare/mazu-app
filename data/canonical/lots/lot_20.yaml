criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 凡事 了錢。拖尾。不合／作事 無成／家事 恐生孽物／婚姻 難合／求財 不得／功名 科運無。難進中／出外 無運。不可／月令
      陰邪作病。難遂——整签偏负（jie_yue_score -16）。唯一开口在时限：治病 大命險。半月好、來人 半月到，都以半个月为界；官事 拖尾破財 与籤文「勸君且退」互为印证。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词几乎逐项设阻——事、财、名、家、出行与月令皆然；仅有的开口是一个以半个月为界的说法，而争端一项被点名会拖长，正与籤文叫人不争的那句相应。
