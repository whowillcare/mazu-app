    evidence: temple judgements run negative throughout - 凡事 了錢。拖尾。不合／作事 無成／家事 恐生孽物／婚姻
      難合／求財 不得／功名 科運無。難進中／出外 無運。不可／月令 陰邪作病。難遂 (jie_yue_score -16)
