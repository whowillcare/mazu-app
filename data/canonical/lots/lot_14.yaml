criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 凡事 大吉／作事 決意成功／家事 光前裕後。可喜／家運 平安／婚姻 成好／求兒 平正／六甲 先男後女。富貴／求財 月光進。漸暗少／功名
      可喜／歲君 中和／治病 險。月光過不畏／出外 不可。必得貴人／經商 漸得／來人 月尾到／行舟 月圓過大吉／移居 吉／失物 西方尋。月光在／求雨 月半無。月尾有／官事
      破財後。完明／六畜 大吉／耕作 早晚有收成／築室 子孫永發其昌／墳墓 得其地。後大吉／討海 月光過。大吉／作塭 先微。後有大利／魚苗 大利／月令 頭破錢。後如意／尋人
      月中至／遠信 速至（jie_yue_score +21）。整签偏吉，唯 治病 險、求財 漸暗少、出外 不可。必得貴人 三处需留意。校勘：全一致（六源同文），无裁定改动。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词整体偏正面，涵盖家事、家运、婚姻、六甲、功名、经商、移居、六畜、耕作、修筑与水上作业诸类目，我方读作 favourable。；需留意的是治病、求财与出外三处，其中出外一项附了一位贵人。
