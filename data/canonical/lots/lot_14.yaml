guidance:
  relationships:
    en: 'A good season for a match: the temple''s judgement is favourable where both
      are willing, and the tone is settled rather than hurried.'
    zh: 姻缘在这一季是好的：庙本在两厢情愿处的判词偏正面，语气是定下来，不是赶。
    compliance_tag: null
  career:
    en: Decide, and carry the decision through — the judgement here is success by
      a settled will. Rank is within reach, though the gain shows first on the money
      side.
    zh: 把主意定下来，并且做到底——这里的判词是拿定主意就成事。名位也够得着，只是先看着落的是钱财这一头。
    compliance_tag: null
  money:
    en: The money question clarifies by degrees; the gain lands at the full moon and
      thins after it, so secure this round rather than count on the next. *(Not financial
      advice.)*
    zh: 钱财的事渐渐分明；收益落在月圆，月圆之后转薄，所以这一轮要收进来，别指望下一轮。（非财务建议。）
    compliance_tag: not_financial_advice
  health:
    en: The judgement calls this stretch for the body risky and the far side of the
      moon safer; bring in a qualified professional rather than coast through it.
      *(Not medical advice.)*
    zh: 庙本把这一段看成身体上吃紧，月圆之后才稳；请合格的专业人士来看，不要顺着日子硬扛。（非医疗建议。）
    compliance_tag: not_medical_advice
  family_home:
    en: The household comes out ahead of its forebears and settles to the good; loud
      as the season is, the home is at peace.
    zh: 家宅出在前人之上，安稳向好；季节再喧动，家里是平的。
    compliance_tag: null
  travel_moving:
    en: Going far from home is the one thing marked not yet, with a helper promised
      in exchange; keep the move or the journey to the near side of the full moon.
    zh: 远行是唯一记着「还不是时候」的一项，换来的是一位贵人；搬动或出行，留在月圆之前这一侧。
    compliance_tag: null
  sea_and_voyage:
    en: 'Good water after the full moon: the passage and the take are both favourable,
      and the first run of it is modest.'
    zh: 月圆之后水色好：航路与渔获都顺，头一趟进项不大。
    compliance_tag: null
  livelihood_and_seasons:
    en: The fields pay early and late in the season, the herds do well, and the ponds
      turn a small profit first and a large one after; the round finishes better than
      it begins.
    zh: 田里早晚都有收成，六畜好，鱼塭先薄利、后有大利；这一轮收尾比开头好。
    compliance_tag: null
  timing:
    en: The turn comes with the full moon of the season — a season, never a date.
    zh: 转机随着这一季的月圆来——只讲一季，不给日子。
    compliance_tag: null
  what_to_avoid:
    en: Closing early, before the matter has clarified; treating a slow start as a
      refusal.
    zh: 事情还没分明就急着收尾；把开头慢当成被回绝。
    compliance_tag: null
  reassurance:
    en: The clarity here is already on its way; nothing has to be forced to make it
      arrive.
    zh: 这里的清楚已经在路上；不必硬推什么，它自己会到。
    compliance_tag: null
stories:
- title:
    zh: 桃園三結義
    en: The Peach Garden Oath
  is_primary: true
  is_variant: false
  cross_reference_lot: 12
  narrative: null
  poem_connection:
    zh: 这一签取结义相助、同心脱难，正扣签诗“必有贵人相扶助，凶事脱出见太平”。
    en: Sworn brothers helping one another out of danger fits a lot whose poem says
      a helper of worth comes to one's side and trouble is escaped into peace.
- title:
    zh: 曹公賜關公馬袍贈金銀
    en: Cao Cao Gifts Guan Yu a Horse, Robe and Gold
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 曹操是汉末北方的掌权者，官做到丞相，后来封魏王。关羽跟刘备失散，被围之后暂时留在曹营。曹操待他很厚，拜他做偏将军，赐他宅子，又送他锦袍和金银，还把自己骑的赤兔马相赠。赤兔是一匹有名的好马。曹操派张辽去探他的去留之意。关羽打定主意，说受过刘将军的厚恩，誓同生死，不能背弃，但要先立一场功劳报答曹公再走。张辽把这话回给曹操，曹操也称他讲义气。后来关羽在白马一役斩了颜良，解了白马之围。报效过后，他把曹操所赐的东西全部封还，留下书信告辞，仍旧回去投刘备。民间讲这一段，还讲他挂印封金，就是官印挂在堂上、金银封好不动，走时在灞桥上用刀尖挑过曹操赠的锦袍，并不下马。
    en: Cao Cao held power in the north at the end of the Han. He rose to chief minister
      and was later made King of Wei. Guan Yu was cut off from Liu Bei. After being
      surrounded he stayed for a time in Cao's camp. Cao Cao treated him generously,
      made him a general and gave him a house. He sent him a brocade robe, gold and
      silver, and his own horse Red Hare, a famous fine horse. Cao Cao sent Zhang
      Liao to sound out his mind. Guan Yu had made up his mind. He said he had received
      great kindness from General Liu and had sworn to live and die with him, and
      could not turn away. But he would first earn one service to repay Lord Cao,
      and then leave. Zhang Liao took this word back to Cao Cao, who said Guan Yu
      kept faith. Later Guan Yu killed Yan Liang in the fight at Baima and lifted
      that siege. His service done, he sealed up and returned everything Cao Cao had
      given him, and left a letter of farewell. He went back to Liu Bei. It is also
      said that he hung up his seal and sealed the gold, the seal hung in the hall
      and the gold untouched. It adds that as he left, at the Ba Bridge, he hooked
      up Cao Cao's brocade robe with the tip of his blade without dismounting.
  poem_connection:
    zh: 签诗说“财中渐渐见分明，花开花谢结子成”，与所受金银最终封还、恩义两下分清楚一节相贴：财物一层，到头来分得分明。
    en: The poem says that in the matter of wealth things come clear by degrees, and
      the flower sets fruit as it fades; the gold and silver were sealed and returned,
      and both sides' obligations came out clear.
- title:
    zh: 李世民遊地府
    en: Emperor Taizong of Tang Tours the Underworld
  is_primary: false
  is_variant: true
  cross_reference_lot: null
  narrative:
    zh: 唐太宗李世民在位时，泾河的龙王与长安城里的术士袁守诚打赌，赌什么时候下雨、下多少。龙王输了，触犯了天条，该由大臣魏征处斩。龙王向唐太宗求救，太宗答应下来，就把魏征留在宫中下棋，不让他脱身。不料魏征在梦里出了神，把龙王斩了。龙王的阴魂告到地府，阎王便传唐太宗去对案。太宗跟着判官崔珏游历地府，看见了鬼门关、十殿阎君、十八层地狱和奈何桥。判官见太宗曾答应救龙王而没能救成，就私下替他改了生死簿，给他添了寿数，又指给他还阳的路。太宗在地府待了三昼夜，宫里已经把他装进了棺材。后来开棺相见，太宗还魂。
    en: In the reign of Emperor Taizong of Tang, whose personal name was Li Shimin,
      the Dragon King of the Jing River made a bet with a diviner named Yuan Shoucheng
      in the city of Chang'an. The bet was when it would rain and how much. The Dragon
      King lost. He had broken the law of heaven and was to be beheaded by the minister
      Wei Zheng. The Dragon King begged Emperor Taizong to save him. Taizong agreed,
      and kept Wei Zheng in the palace playing chess so that he could not get away.
      To his surprise Wei Zheng's spirit left his body in a dream and beheaded the
      Dragon King. The ghost of the Dragon King brought the case before the underworld.
      The king of the underworld summoned Emperor Taizong to answer for it. Taizong
      traveled through the underworld with the judge Cui Jue. He saw the Gate of Ghosts,
      the ten courts of the underworld kings, the eighteen levels of hell, and the
      Bridge of Helplessness. The judge saw that Taizong had promised to save the
      Dragon King and failed. So he privately changed the register of life and death
      for him, added years to his span, and pointed out the road back to life. Taizong
      stayed in the underworld for three days and nights, and in the palace they had
      already laid him in a coffin. Later the coffin was opened and he came back to
      life.
  poem_connection:
    zh: 签诗“财中渐渐见分明”“宽心且看月中桂”，由模糊而渐明，正对入冥三日、事明还魂。
    en: The lot's poem says matters become clear little by little, and tells one to
      be at ease and watch the cassia in the moon. Clearing up by degrees fits three
      days among the dead and a return to life.
