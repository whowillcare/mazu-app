reading_notes:
- term: 月中桂
  pinyin: yuè-zhōng-guì
  en: 'the cassia in the moon: the cassia tree that the old moon-lore shows only at
    the full moon; also the laurel of the old examinations, so the same image carries
    a hoped-for success; the poem keeps both.'
  zh: ：一是老话里那棵只在月圆时才看得见的月桂；二是旧时科考的折桂，同一个意象里也带着求取功名的指望。诗把两层都留着。
- term: 寬心
  pinyin: kuān-xīn
  en: 'to ease the heart: broadening one''s own mind, that is, patience; setting the
    worry down, not putting the work off.'
  zh: ：是把自己的心放阔，也就是耐性；是把担心放下，不是把活计推后。
- term: 即便
  pinyin: jí-biàn
  en: 'then, and straight away: at that very point, immediately upon it; as soon as
    the moon''s turn comes; the line ties its peace to the image, not to the calendar.'
  zh: ：就是「到那时就」，紧接着的意思；月亮那一转一到便如何。这一句把太平系在月相上，不系在日历上。
plain_meaning:
  en: 'A season that clarifies by degrees: the money side of the matter comes into
    focus, what flowered and fell leaves fruit behind it, and the moon in the poem
    is a full one. The counsel is to be easy and let the round finish - the outcome
    arrives by patience rather than by a push, and it lands on the far side of the
    moon''s turn.'
  zh: 这是一个渐渐看清的季节：钱财方面的事慢慢明朗起来，花开过又谢了，身后留下果子，诗里的月亮是一轮满月。给出的做法是放宽心、让这一轮走完——结果是靠耐性到的，不是靠硬推，它落在月圆那一转之后。
