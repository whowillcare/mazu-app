verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 言語雖多不可從，
    en: Though the words are many, they are not to be followed;
  - line_number: 2
    zh: 風雲靜處未行龍，
    en: where wind and cloud lie still, the dragon has not moved.
  - line_number: 3
    zh: 暗中終得明消息，
    en: In the dark you finally get clear news;
  - line_number: 4
    zh: 君爾何須問重重。
    en: why must you ask, and ask again?
keywords:
