    evidence: temple judgements run guarded throughout - 凡事 不和。有鬼作祟／婚姻 口舌多難成／求兒 不好。有呆人／功名
      未遂。不可／出外 不可／移居 不可望／經商 夥不和者。無利／六畜 不好／月令 有口舌 (jie_yue_score 6)
