criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 庙本解曰：凡事 不和。有鬼作祟／作事 未日辰日成好／家事 門第大益／家運 平常／婚姻 口舌多難成／求兒 不好。有呆人／六甲
      生男。後女／求財 輕淡有利益／功名 未遂。不可／歲君 浮沉／治病 老不好。少不畏／出外 不可／經商 夥不和者。無利／來人 半月到／行舟 先凶後吉／移居
      不可望／失物 無／求雨 尚未／官事 平後。拖尾。了錢／六畜 不好／耕作 早好／築室 好／墳墓 地氣漸發吉／討海 春夏不佳。冬平／作塭 先無利。後有望／魚苗
      有利入手／月令 有口舌／尋人 慢回／遠信 音信慢至（jie_yue_score +6）。整签偏负：总类、婚姻、功名、出外、移居、经商、月令一路吃紧，唯
      家事 門第大益、築室 好、耕作 早好 与 墳墓 地氣漸發吉 是几处亮点，行舟 先凶後吉、作塭 先無利。後有望 留了后段的话。校勘：全一致。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在本签涉及的类目里整体取守势：总类、婚姻、功名、出外、移居、经商、月令多处偏向阻隔，并且点了口舌与闲话；家宅、筑室、早耕几处是难得的亮点，水上与塭池两项留了后段的话。整签按保守取向读，重点在守与等。
