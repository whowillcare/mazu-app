reading_notes:
- term: 不可從
  pinyin: bù-kě-cóng
  en: 'not to be followed: do not act on what you are told; do not go along with the
    people pressing you.'
  zh: 既指别人告诉你的话不要照着做，也指别跟着那些催你的人一起走；两层都带劝的味道。
- term: 未行龍
  pinyin: wèi-xíng-lóng
  en: 'the dragon has not yet moved: your hour has not come; the one who acts is still
    waiting; the line does not name the dragon.'
  zh: 既指你的时辰还没到，也指那个该动的人还在等；这一句并没有点名「龙」是谁。
- term: 暗中
  pinyin: àn-zhōng
  en: 'in the dark, unseen: while you are still hidden from view; by quiet and unobserved
    means.'
  zh: 既指你还隐在人后、没被看见，也指用安静、不张扬的方式去做。
plain_meaning:
  en: 'A guarded season: the lot reports plain disagreement, gossip that does not
    settle, and many plans that come to nothing, with going out, moving house and
    advancement all held back. The poem''s counsel is not to follow the many voices
    and not to act while wind and cloud lie still; what you already know in the quiet
    is the clear news, so there is little profit in asking again and again.'
  zh: 这是一段要看住的时节：判词说各方还合不拢，闲话不少，许多打算落不到实处，出行、搬家、功名都被按下。诗的劝法是不跟着众人的话走，风没起、云还静的时候不要动；你心里安静时已经知道的那点消息，才是清楚的消息，所以再问下去也没有多少意思。
