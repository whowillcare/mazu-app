  family_home:
    en: The household does not come together now; leave the dispute where it lies.
    zh: 家里现在聚不到一起；把争执放下。
    compliance_tag: null
  travel_moving:
    en: The poem says do not set out; the road is hard in stages.
    zh: 签诗说不要动身；路上是一段段的难走。
    compliance_tag: null
  sea_and_voyage:
    en: Guard against danger on the water; no profit in a voyage this season.
    zh: 水上要防险；这一季出航没有进益。
    compliance_tag: null
  livelihood_and_seasons:
    en: The season returns nothing for the work; keep your outlay minimal.
    zh: 这一季的工夫回不了本；把投进去的压到最少。
    compliance_tag: null
  timing:
    en: Stop for now; the turning point is not in this season — a season, never a
      date.
    zh: 先停下来；转向不在这一季——只讲季节，不给日子。
    compliance_tag: null
  what_to_avoid:
