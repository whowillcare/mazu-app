reading_notes:
- term: 一重…一重…
  pinyin: yī-zhòng-yī-zhòng
  en: '"one layer, then another": the poem''s figure for *obstacles stacked*, not
    one obstacle; The counsel follows from the figure.'
  zh: 是阻碍层层相叠的说法，不是只有一道；后面的话就是从这层叠的意象来的。
- term: 改求
  pinyin: gǎi-qiú
  en: '"change what you ask for": at once *changing your demand* and *trying another
    route*; Neither gets through.'
  zh: 既是改换你所求的东西，也是另走一条路；两者都过不去。
- term: 是非
  pinyin: shì-fēi
  en: '"right and wrong": at once *a quarrel over blame* and *the tangled merits of
    a case*; The line warns against waiting for it to be settled.'
  zh: 既是一场争对错的吵闹，也是一桩理不清的案子；这一句提醒的是别等它被理清。
plain_meaning:
  en: 'The obstacles are stacked rather than single, and changing the plan does not
    clear them: whichever route is taken it does not get through, and the quarrel
    does not settle into peace. This is a season to stop spending on the crossing
    and to leave the dispute where it lies.'
  zh: 阻碍是一重接一重的，不是单单一道；换条路走也还是过不去，争执也拖不到一个安稳。这一季该做的是：别再为过这道口子花钱，把是非就留在那儿。
question_gate:
  scope: one_matter
  rewritten_from:
    en: Is this ever going to work out for me?
    zh: 这件事最后到底会不会为我办成？
  rewritten_to:
    en: What should I stop spending on, and what should I leave as it is?
    zh: 我该停掉哪一笔花用，又该把什么就这么放着？
  rewrite_reason:
    code: closed_question
    zh_explanation: 原问是封闭式的成败题，改为可以行动的取舍问题。
  blocked: false
  disclosed_to_user: true
guidance:
  relationships:
    en: No good ground for a match this season; the quarrel does more harm than the
      absence.
    zh: 这一季没有谈成姻缘的好地；这场争执带来的伤害比空着更大。
    compliance_tag: null
  career:
