register:
  level: mixed
  source: curated
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    source_note: 人工定档，判据＝解曰判词极性；第二轮独立定档待母语审
    evidence: temple judgements lean negative on the large undertakings - 凡事 拖尾。了錢／作事
      成無益。犯官事／婚姻 難得／求財 淡有／出外 不可／移居 不可／月令 不遂／六畜 不得利。了錢／魚苗 無利可得, while household and
      small works hold and later mend - 家事 門庭平安／家運 小吉／官事 不畏／治病 拖尾。後痊癒／經商 後來有得／耕作 平平
      (jie_yue_score 5)
  external:
    visibility: public
    audience: all_users
    source_note: our editorial reading of the lot's tone；the temple books do not grade
      these lots
    evidence: The temple book reads this lot two ways — the large undertakings run
      against (general affairs running long, journeys and moves not for now, an adverse
      month's season, and nothing to be had from livestock or fry), while the household
      and small works hold their ground and mend later (a peaceful door, a small blessing
      on the family fortune, no fear in legal matters, and trade that comes good afterwards).
      The composite sits near the middle, so we read this lot as mixed. The witnesses
      also divide on one word in the second line (陰色 vs 蔭色); this edition follows
      the majority reading 蔽陰色 and holds both senses open.
criteria:
  internal:
    visibility: internal
    audience: admin_and_internal_audit_only
    description_zh: 照抄庙本解曰（庙方原文，供核验）
    raw_temple_text: 内部判据（照抄庙本解曰）：凡事 拖尾。了錢／作事 成無益。犯官事／家事 門庭平安／家運 小吉／婚姻 難得／求兒 慢即好／六甲
      先男後女／求財 淡有／功名 望後科／歲君 把方殺／治病 拖尾。後痊癒／出外 不可／經商 後來有得／來人 月光到／行舟 有小利。把定／移居 不可／失物 月光在／求雨
      不日到／官事 不畏／六畜 不得利。了錢／耕作 平平／築室 不合。按住／墳墓 地運呆。後得吉／討海 平平小利／作塭 有小利／魚苗 無利可得／月令 不遂／尋人
      遠回／遠信 音信慢至——整签两头读：大事那一边偏阻（凡事 拖尾。了錢／出外 不可／移居 不可／月令 不遂／六畜 不得利。了錢／魚苗 無利可得），家宅与小事那一边站得住、而且后面会回正（家事
      門庭平安／家運 小吉／官事 不畏／治病 拖尾。後痊癒／經商 後來有得／耕作 平平），故列为平签（jie_yue_score +5）。经文异文见 蔽陰色
      条：多数本作「陰色」，两本作「蔭色」，从多数作「蔽陰色」。
  external:
    visibility: public
    audience: all_users
    description_zh: 我方概括（合规发布用）
    summary_zh: 庙本判词在这一签上两头都读——大事那一边偏阻（总类带尾、出门与搬动都不是时候、月令一处偏逆、牲口与鱼苗两处见不到好处），家宅与小营生那一边站得住，而且后面会回正（家事平安、家运小吉、官事不畏、经商后来有得）。综合分值贴近正负门槛，故列为本批的平签一档。诗第二句另有异文，「陰色」「蔭色」两读并存，本件从多数作「蔽陰色」。
provenance:
  editorial_note: null
  textual_provenance: majority — 「蔽陰色 - shading its dark colour (维基文库; 好廟網)」→「蔽蔭色
    - shading its shade (mznn; 91chouqian)」→「蔽阴色 - the same reading as 陰色 in simplified
    characters (feishuai), so the difference there is orthographic only」, majority
    of witnesses (the 陰色 reading, counting the simplified witness with the traditional
    ones)
  reviewed_on: '2026-10-06'
verse:
  classical_form: 七言絕句 (7-character quatrain)
  english_style: unrhymed cadence
  lines:
  - line_number: 1
    zh: 月出光輝本清吉，
    en: 'The moon comes out: its light is clear and auspicious by nature;'
  - line_number: 2
    zh: 浮雲總是蔽陰色，
    en: but floating clouds keep shading its colour;
  - line_number: 3
    zh: 戶內用心再作福，
    en: within the household, put your heart into doing good again;
  - line_number: 4
    zh: 當官分理便有益。
    en: and when the case is weighed and divided fairly, there is benefit.
keywords:
  favourable:
    en:
    - work done inside the household
    - a small honest gain
    - putting a case to fair judgement
    - the light behind the cloud
    - ordinary returns, slowly
    zh:
    - 在家里头下的功夫
    - 一份小而实的进项
    - 把事交给公断
