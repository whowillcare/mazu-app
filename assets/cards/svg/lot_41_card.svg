<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <!-- Outer Greek Key Border Pattern -->
    <pattern id="greekCorner_41" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,0 H20 V20 H10 V10 H15 V15 H5 V5 H20" fill="none" stroke="#D4AF37" stroke-width="1.2" />
    </pattern>

    <!-- Central Artwork Clipping Mask -->
    <clipPath id="artworkPortal_41">
      <rect x="36" y="142" width="328" height="340" rx="6" />
    </clipPath>

    <!-- Radial Vignette for Central Artwork -->
    <radialGradient id="portalVignette_41" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="transparent" />
      <stop offset="100%" stop-color="#070B11" stop-opacity="0.9" />
    </radialGradient>

    <!-- Top & Bottom Edge Vignettes to Prevent Bleed -->
    <linearGradient id="topEdgeFade_41" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070B11" stop-opacity="0.9" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <linearGradient id="bottomEdgeFade_41" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="100%" stop-color="#070B11" stop-opacity="0.95" />
    </linearGradient>

    <!-- Shimmer Gold Foil Gradient -->
    <linearGradient id="shimmerGradient_41" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#E8C96C" stop-opacity="0.18" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- 1. Background Slate Canvas -->
  <rect width="400" height="600" fill="#070B11" />

  <!-- 2. Outer Greek Key / Double Border (Strict lot_01 standard) -->
  <rect x="16" y="16" width="368" height="568" rx="10" fill="none" stroke="rgba(212, 175, 55, 0.65)" stroke-width="1.5" />
  <rect x="24" y="24" width="352" height="552" rx="6" fill="none" stroke="rgba(212, 175, 55, 0.45)" stroke-width="0.8" />

  <!-- Corner Accents (4 Geometric Corners) -->
  <g stroke="#D4AF37" stroke-width="1.2" fill="none">
    <path d="M 28 40 L 40 40 L 40 28" />
    <path d="M 372 40 L 360 40 L 360 28" />
    <path d="M 28 560 L 40 560 L 40 572" />
    <path d="M 372 560 L 360 560 L 360 572" />
  </g>

  <!-- 3. Top Serial Number (Standard lot_01 style: universal Arabic numeral) -->
  <text x="200" y="56" text-anchor="middle" fill="#E8C96C" font-family="Cinzel, 'Noto Serif SC', serif" font-size="26" font-weight="bold" letter-spacing="2">
    41
  </text>
  <!-- Decorative Header Flourish Lines -->
  <line x1="140" y1="50" x2="165" y2="40" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1" />
  <line x1="260" y1="50" x2="235" y2="40" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1" />

  <!-- 4. Top Seal Stamp (Centered directly below top serial number) -->
  <g transform="translate(180, 70)">
    <image href="data:image/png;base64," width="40" height="40" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- 5. Center Sacred Geometry Artwork (Clipped into clean inner portal) -->
  <g clip-path="url(#artworkPortal_41)">
    <image href="/assets/cards/lot_41_card.jpg" x="20" y="95" width="360" height="435" preserveAspectRatio="xMidYMid slice" />
    <!-- Edge vignettes for seamless integration -->
    <rect x="36" y="142" width="328" height="340" fill="url(#portalVignette_41)" />
    <rect x="36" y="142" width="328" height="28" fill="url(#topEdgeFade_41)" />
    <rect x="36" y="452" width="328" height="30" fill="url(#bottomEdgeFade_41)" />
  </g>

  <!-- Inner Portal Frame Rule -->
  <rect x="36" y="142" width="328" height="340" rx="6" fill="none" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1" />

  <!-- 6. Bottom Typography Footer (Classical Chinese & English Serif) -->
  <text x="200" y="518" text-anchor="middle" fill="#F5E6BE" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="19" font-weight="600" letter-spacing="4">
    王孝先為民祈雨 · 庚申
  </text>
  <text x="200" y="545" text-anchor="middle" fill="#D4AF37" font-family="Cinzel, 'Times New Roman', serif" font-size="11" font-weight="500" letter-spacing="2">
    WANG XIAOXIAN PRAYS FOR RAIN
  </text>
</svg>